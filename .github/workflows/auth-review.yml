name: Google access - isolated security tests
on:
  push:
    branches: ['feature/google-access']
    paths: ['auth/**', 'tests/auth/**', 'scripts/build_auth_bundle.py', '.github/workflows/auth-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isegye-auth-review
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned JWT verifier
        run: |
          php -v
          composer install --working-dir=auth --no-dev --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
          composer audit --working-dir=auth --no-dev
      - name: Syntax, storage and signature tests
        run: |
          find auth -maxdepth 1 -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/auth/store_test.php
          php tests/auth/jwt_test.php
      - name: Install browser tools
        timeout-minutes: 6
        run: |
          python -m venv /tmp/auth-check
          /tmp/auth-check/bin/pip install --disable-pip-version-check playwright==1.56.0 cryptography
          /tmp/auth-check/bin/python -m playwright install --with-deps chromium
      - name: Test registration and first administrator with local synthetic identities only
        run: /tmp/auth-check/bin/python tests/auth/browser.py
      - name: Build credential-free runtime and export source for verification
        run: |
          python scripts/build_auth_bundle.py
          git archive --format=zip -o test-results/auth/source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auth-runtime-${{ github.sha }}
          path: auth-bundle/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auth-tests-${{ github.sha }}
          path: test-results/auth/
          retention-days: 14
