name: Playground - isolated maintenance checks
on:
  push:
    branches: ['fix/playground-growth-editorial-20261124']
permissions: {contents: write}
concurrency:
  group: playground-maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/fix/playground-growth-editorial-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Apply exact locally tested maintenance patch on isolated branch
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          from pathlib import Path
          raw=lzma.decompress(base64.b64decode(''.join(Path(f'.maintenance/playground-patch.{i}.b64').read_text() for i in range(1,5)),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='878c64b3fb6cfabf05bb64ad156b62b7baf445a0a897fb52ee13764d42ffb45b'
          subprocess.run(['git','apply','--check','--index','-'],input=raw,check=True)
          subprocess.run(['git','apply','--index','-'],input=raw,check=True)
          PY
      - name: Install pinned test tools without production credentials
        run: |
          python -m pip install tinycss2==1.4.0 beautifulsoup4==4.14.3 pillow==11.3.0 playwright==1.56.0
          bash scripts/ci_browser_install.sh python
      - name: Run full local regressions and compiled component browser checks
        run: |
          mkdir -p test-results/playground-maintenance
          npm test > test-results/playground-maintenance/javascript.log 2>&1
          GITHUB_REF=refs/heads/feature/playground DEPLOY_ENV=preview python scripts/build_playground.py
          GITHUB_REF=refs/heads/feature/fanmade DEPLOY_ENV=preview python scripts/build_fanmade.py
          python -m unittest discover -s tests -p 'test_*.py' -v > test-results/playground-maintenance/python.log 2>&1
          python tests/playground_maintenance_browser.py
      - name: Export tested source blobs without changing branches or workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          repo='seirian/isegye-idol-fansite'
          assert os.environ['GITHUB_REPOSITORY']==repo and os.environ['GITHUB_REF']=='refs/heads/fix/playground-growth-editorial-20261124'
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==22 and all(not p.startswith('.maintenance/') for p in paths)
          subprocess.run(['git','diff','--exit-code','--',*paths],check=True)
          report={'status':'tested_blobs_created','parent':os.environ['GITHUB_SHA'],'baseTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'files':{},'branchUpdated':False,'productionAccessed':False}
          for path in paths:
              raw=subprocess.check_output(['git','show',':'+path])
              value={'content':raw.decode(),'encoding':'utf-8'}
              obj=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+repo+'/git/blobs','--input','-'],input=json.dumps(value).encode()))
              expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\x00'+raw).hexdigest()
              assert obj['sha']==expected
              report['files'][path]={'sha':obj['sha'],'sha256':hashlib.sha256(raw).hexdigest()}
              Path('test-results/playground-maintenance/blobs.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('22개 검증 소스 객체 기록 완료 · 브랜치 변경/운영 접근 없음\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playground-maintenance-checked-${{ github.run_id }}
          path: test-results/playground-maintenance/
          retention-days: 7
