name: Apply reviewed member legal source
on:
  push:
    branches: ['fix/member-legal-shell']
permissions:
  contents: write
jobs:
  source:
    if: github.ref == 'refs/heads/fix/member-legal-shell'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Verify and apply the exact reviewed source patch
        run: |
          test "$(git rev-parse HEAD^)" = dac87941524e5957c6f034c7d6642be04fa06a40
          echo 'a75b9d9edb78666609e90947574eff27b8eb846e6e6f41848159a59927ecd078  .legal-transfer/changes.patch' | sha256sum -c -
          git apply --check --index .legal-transfer/changes.patch
          git apply --index .legal-transfer/changes.patch
          git rm .legal-transfer/changes.patch .github/workflows/legal-source-apply.yml
          test "$(git write-tree)" = 4ede7b4ab3ed09231930d9c877fa747eedd9c6b9
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: separate public and signed-in legal pages with shared site theme'
          git push origin HEAD:fix/member-legal-shell
