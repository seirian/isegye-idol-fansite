name: Repair - finalize verified reliability patch
on:
  push:
    branches: [fix/batch-reliability-20261113]
    paths: [.github/workflows/repair-gallery-cache.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/fix/batch-reliability-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install offline-test dependencies
        run: python -m pip install pillow==11.3.0 beautifulsoup4==4.14.3 tinycss2==1.4.0
      - name: Apply exact reviewed source adapters and pin cache manifest
        run: |
          python - <<'PY'
          import hashlib, io, json
          from pathlib import Path
          from PIL import Image
          root=Path('.')
          rows=json.loads(Path('home-review/gallery.json').read_text())
          images={}
          for r in rows:
              raw=Path('home-review/gallery-cache/'+r['id']+'.webp').read_bytes()
              image=Image.open(io.BytesIO(raw))
              images[r['id']]={'sourceSha256':r['sha256'],'sha256':hashlib.sha256(raw).hexdigest(),'width':image.width,'height':image.height,'bytes':len(raw),'sourceUrl':r['url'],'sourceWidth':r['width'],'sourceHeight':r['height']}
          manifest={'schemaVersion':1,'provenance':{'runId':42922168252,'artifactId':13812453298,'archiveSha256':'6f35fe840af0729353a8c6cd5b8af5096f21befaebc2d6652836deb27fa315bc','headSha':'f6147b469366f5791bd84109f001776729b962a9'},'images':images}
          Path('home-review/gallery-cache.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          path=Path('scripts/compose_home_presentation.py')
          assert hashlib.sha256(path.read_bytes()).hexdigest()=='131f7025d13adf5adb5fb38a627903d675ef070c5f36ad4077d64b2a907a4ae8'
          text=path.read_text().replace('from urllib.parse import urlparse','from urllib.parse import urlparse\nfrom gallery_cache import load as cached_image')
          text=text.replace('data = prepare((fetcher or download)(row), row)','data = prepare(fetcher(row), row) if fetcher else cached_image(row)')
          path.write_text(text)
          path=Path('scripts/album_observation_archive.py')
          text=path.read_text()
          before="        if len(rows) != 1 or rows[0].file_size > MAX_BYTES:\n            raise ValueError('Missing, duplicate or oversized snapshot')"
          after="        if not rows:\n            gates = [i for i in archive.infolist() if i.filename == 'albums-gate.json']\n            if len(gates) == 1 and gates[0].file_size <= 4096:\n                gate = json.loads(archive.read(gates[0]))\n                if gate.get('status') == 'paused' and gate.get('allowed') is False:\n                    return None\n"+before
          assert text.count(before)==1
          text=text.replace(before,after).replace("'artifacts':[], 'errors':[]","'artifacts':[], 'skippedArtifacts':[], 'errors':[]")
          before='                    count, conflicts = recover_points(current, candidate)'
          assert text.count(before)==1
          text=text.replace(before,"                    if candidate is None:\n                        report['skippedArtifacts'].append({'id': item['id'], 'reason': 'scheduled_night_pause'})\n                        continue\n"+before)
          path.write_text(text)
          path=Path('review/home-release.json')
          approval=json.loads(path.read_text())
          names=['scripts/compose_home_presentation.py','scripts/gallery_cache.py','home-review/gallery-cache.json']+['home-review/gallery-cache/'+k+'.webp' for k in ['christmas','pastel','rewind','hanteo','mafia']]
          for name in names:approval['sourceHashes'][name]=hashlib.sha256(Path(name).read_bytes()).hexdigest()
          approval['presentationUpdates'].append({'requestedAt':'2026-11-13','scope':'Batch/deployment reliability: use exact checksum-pinned previously verified gallery WebP bytes offline. No new image, crop, quality, source metadata, UI or access-policy changes.'})
          path.write_text(json.dumps(approval,ensure_ascii=False,indent=2)+'\n')
          PY
          git rm .github/workflows/repair-gallery-cache.yml
          git add scripts/compose_home_presentation.py scripts/album_observation_archive.py review/home-release.json home-review/gallery-cache.json
          TREE="$(git write-tree)"
          echo "Verified candidate tree: $TREE"
          test "$TREE" = 8ad7c9e8b47be08a60365b1f3ab0100bdbec0d05
      - name: Run complete offline regression suite
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit only the validated feature-branch tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/fix/batch-reliability-20261113
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix batch recovery and remove gallery network dependency'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" push https://github.com/seirian/isegye-idol-fansite.git HEAD:refs/heads/fix/batch-reliability-20261113
          git rev-parse HEAD
