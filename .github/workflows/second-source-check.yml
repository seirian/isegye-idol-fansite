name: Second concept - public portrait source check
on:
  push:
    branches: ['feature/second']
    paths: ['.github/workflows/second-source-check.yml']
permissions:
  contents: read
jobs:
  sources:
    if: github.ref == 'refs/heads/feature/second'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve the six profile images listed on PARABLE creator network
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python - <<'PY'
          import json,urllib.request,urllib.parse,hashlib,io
          from pathlib import Path
          from PIL import Image
          out=Path('official-portraits');out.mkdir()
          records=[]
          for slug,name,filename in [('ine','아이네','아이네-프로필.webp'),('jingburger','징버거','channels4_profile.webp'),('lilpa','릴파','릴파-프로필.jpg'),('jururu','주르르','주르르-프로필.webp'),('gosegu','고세구','고세구-프로필.jpg'),('viichan','비챤','비찬-프로필.webp')]:
              url='https://parable-asia.com/wp-content/uploads/2026/04/'+urllib.parse.quote(filename)
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as r:body=r.read(8*1024*1024)
              im=Image.open(io.BytesIO(body));im.thumbnail((800,800));im.save(out/(slug+'.webp'),'WEBP',quality=90)
              records.append({'id':slug,'member':name,'sourcePage':'https://parable-asia.com/creator-network/','sourceUrl':url,'sourceSha256':hashlib.sha256(body).hexdigest(),'filename':filename,'file':slug+'.webp','width':im.width,'height':im.height,'sha256':hashlib.sha256((out/(slug+'.webp')).read_bytes()).hexdigest(),'namuMatchVerified':False,'usage':'Review-only official-source fallback; requested NamuWiki images remain pending exact verification.'})
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2));print(json.dumps(records,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: second-official-portraits-${{ github.run_id }}
          path: official-portraits/
          retention-days: 14
