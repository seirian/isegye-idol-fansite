name: Second concept - public portrait source check
on:
  push:
    branches: ['feature/second']
    paths: ['.github/workflows/second-source-check.yml']
permissions:
  contents: read
jobs:
  sources:
    if: github.ref == 'refs/heads/feature/second'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect public mirror (NamuWiki live returned 403; do not bypass)
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4 pillow==11.3.0
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error, io
          from pathlib import Path
          from bs4 import BeautifulSoup
          from PIL import Image
          out=Path('source-audit'); out.mkdir(exist_ok=True)
          report=[]
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=18) as r:
                  return r.read(6*1024*1024),r.status
          for slug,name in [('ine','아이네'),('jingburger','징버거'),('lilpa','릴파'),('jururu','주르르'),('gosegu','고세구'),('viichan','비챤')]:
              item={'member':name,'slug':slug,'original':'https://namu.wiki/w/'+urllib.parse.quote(name),'liveNamuVerified':False,'candidates':[]}
              for domain in ['namu.moe','d.namu.moe']:
                  url='https://'+domain+'/w/'+urllib.parse.quote(name)
                  try:
                      data,status=fetch(url); soup=BeautifulSoup(data,'html.parser'); item.update(mirror=url,status=status)
                      candidates=[]; seen=set()
                      for img in soup.find_all('img'):
                          alt=img.get('alt','')
                          if name not in alt or any(x in alt for x in ['서명','미니','이모티콘','마크','로고','길드','아바타','유튜브']): continue
                          src=img.get('data-src') or img.get('src')
                          if not src or src.startswith('data:'):continue
                          src=urllib.parse.urljoin(url,src)
                          if src in seen:continue
                          seen.add(src)
                          candidates.append({'alt':alt,'url':src})
                      item['named_images']=candidates[:20]
                      priority=sorted(candidates,key=lambda x:0 if any(w in x['alt'] for w in ['지니','프로필']) else 1)
                      for cand in priority[:3]:
                          try:
                              body,_=fetch(cand['url']);im=Image.open(io.BytesIO(body))
                              if min(im.size)<200:continue
                              filename=slug+'-'+str(len(item['candidates']))+'.webp'
                              im.thumbnail((1000,1000));im.save(out/filename,'WEBP',quality=90)
                              item['candidates'].append({**cand,'file':filename,'dimensions':im.size})
                          except Exception as exc:cand['download_error']=type(exc).__name__
                      if item['candidates']:break
                  except Exception as exc:item[domain+'_error']=type(exc).__name__
              report.append(item)
          (out/'mirror-result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: second-profile-candidates-${{ github.run_id }}
          path: source-audit/
          retention-days: 14
