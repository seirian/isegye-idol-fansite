name: Second concept - public portrait source check
# Source discovery is complete. Do not repeat collection on every design push.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    if: github.ref == 'refs/heads/feature/second'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: cat docs/SECOND.md
