name: Stage approved second-review production source
on:
  push:
    branches: ['release/review-2nd-261105']
    paths: ['.release-promotion/**', '.github/workflows/promote-review2-source.yml']
permissions:
  contents: write
concurrency:
  group: stage-review2-production
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/release/review-2nd-261105'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 2}
      - name: Verify tested source and materialize only the release branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^') == 'f09c755053fc23b777de695170a8160a48ebe43e'
          root=Path('.release-promotion')
          m=json.loads((root/'manifest.json').read_text())
          expected=m.pop('expectedTree')
          assert expected=='5c394701527154faf9c3d1b1aa0f9505d3fcc3c5'
          assert set(m)=={str(i)+'.patch' for i in range(1,6)}
          paths=[]
          for name,digest in sorted(m.items()):
              path=root/name
              assert not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
              paths.append(str(path))
          subprocess.run(['git','apply','--check',*paths],check=True)
          subprocess.run(['git','apply',*paths],check=True)
          shutil.rmtree(root)
          Path('.github/workflows/promote-review2-source.yml').unlink()
          subprocess.run(['git','add','-A'],check=True)
          assert git('write-tree')==expected, 'Source differs from locally tested complete tree'
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','feat: promote accepted second review with existing runtime feeds'],check=True)
          subprocess.run(['git','push','origin','HEAD:release/review-2nd-261105'],check=True)
          print('Verified source tree:', expected)
          print('Release commit:',git('rev-parse','HEAD'))
          print('Main, develop, backup and preview branches were not changed.')
          PY
