name: Albums deployment read-only diagnosis
on:
  push:
    branches: ['fix/albums-deploy-recovery']
    paths: ['.github/workflows/albums-deploy-diagnose.yml', 'scripts/diagnose_album_deploy.py']
permissions: {contents: read, actions: read}
concurrency:
  group: isegye-inour-production
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python -m pip install paramiko==5.0.0
      - name: Read own deployment markers without changing files or accounts
        env:
          ISEGYE_SFTP_PASSWORD: ${{ secrets.ISEGYE_SFTP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/diagnose_album_deploy.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: albums-deploy-diagnosis-${{ github.run_id }}
          path: albums-deploy-diagnosis.json
          retention-days: 14
