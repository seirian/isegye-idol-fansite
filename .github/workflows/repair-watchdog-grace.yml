name: Repair - validate recovery grace
on:
  push:
    branches: [fix/batch-reliability-20261113]
    paths: [.github/workflows/repair-watchdog-grace.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/fix/batch-reliability-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Apply and validate the bounded five-minute recovery grace
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/batch_watchdog.py');s=p.read_text()
          assert s.count('grace=timedelta(minutes=10)')==1
          p.write_text(s.replace('grace=timedelta(minutes=10)','grace=timedelta(minutes=5)'))
          p=Path('tests/test_batch_watchdog.py');s=p.read_text()
          anchor='    def test_cooldown_uses_latest_attempt_time(self):'
          assert s.count(anchor)==1
          addition="    def test_twelve_minute_watchdog_recovers_five_minute_schedule(self):\n        at=self.at.replace(minute=12)\n        due=w.due_slot('schedule',at)\n        self.assertEqual(w.recovery_action([],at,due,False),'dispatch')\n"
          p.write_text(s.replace(anchor,addition+anchor))
          PY
          git rm .github/workflows/repair-watchdog-grace.yml
          git add scripts/batch_watchdog.py tests/test_batch_watchdog.py
          test "$(git write-tree)" = e4ab6bd50090bd5a742c1d07dac6a36c7440ea9d
          python -m unittest discover -s tests -p 'test_batch_watchdog.py' -v
      - name: Commit verified feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Recover hourly :05 gaps from :12 watchdog without waiting another hour'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" push https://github.com/seirian/isegye-idol-fansite.git HEAD:refs/heads/fix/batch-reliability-20261113
          git rev-parse HEAD
