name: Verify music beginning official MVs
on:
  push:
    branches: [content/music-beginning-mvs]
    paths: [.github/workflows/music-beginning-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exactly the six selected public videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.ISEGYE_YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib,urllib.request,urllib.parse
          ids=['fgSXAKsq-Vo','JY-gJkMuJ94','rDFUl2mHIW4','3cEUPoPXz7E','8IY44RZHyw8','y-klhPVFblg']
          key=os.environ.get('YOUTUBE_API_KEY','').strip()
          if not key: raise SystemExit('Existing YouTube key is not configured')
          url='https://www.googleapis.com/youtube/v3/videos?'+urllib.parse.urlencode({'part':'snippet,contentDetails,status','id':','.join(ids),'key':key})
          try:
              with urllib.request.urlopen(url,timeout=30) as r: data=json.load(r)
          except Exception as e:
              raise SystemExit('Public metadata request failed: '+type(e).__name__) from None
          now=datetime.datetime.now(datetime.timezone.utc)
          found={x['id']:x for x in data.get('items',[])}
          if set(found)!=set(ids): raise SystemExit('Selected videos are not all available')
          result={'checkedAt':now.isoformat(),'source':'YouTube Data API v3 videos.list','scope':'public metadata and availability, not full playback','videos':[]}
          for vid in ids:
              x=found[vid];s=x['snippet'];st=x['status'];d=x['contentDetails']
              if st.get('privacyStatus')!='public' or st.get('embeddable') is not True: raise SystemExit('Selected video is not publicly embeddable')
              if datetime.datetime.fromisoformat(s['publishedAt'].replace('Z','+00:00'))>now: raise SystemExit('Future video rejected')
              result['videos'].append({'videoId':vid,'title':s['title'],'channelId':s['channelId'],'channelTitle':s['channelTitle'],'publishedAt':s['publishedAt'],'duration':d['duration'],'privacyStatus':st['privacyStatus'],'embeddable':st['embeddable'],'url':'https://www.youtube.com/watch?v='+vid,'regionRestriction':d.get('regionRestriction',{}),'description':s.get('description','')})
          pathlib.Path('music-beginning-verification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: music-beginning-original-verification
          path: music-beginning-verification.json
          retention-days: 14
