name: Music integration and network verification (work branch only)
on:
  push:
    branches: [feature/daily-music-catalog]
    paths: [.github/workflows/music-integrate-once.yml]
permissions: {contents: write}
jobs:
  integrate:
    if: github.ref=='refs/heads/feature/daily-music-catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply narrow catalog and gate integration on the work branch only
        run: |
          python - <<'PY'
          from pathlib import Path
          def change(path,old,new):
              f=Path(path);s=f.read_text();assert s.count(old)==1,(path,old[:60]);f.write_text(s.replace(old,new,1))
          f='scripts/enhance_catalog.py';a=' payload={';change(f,a," import daily_music\n from music_video_sources import selections\n sources=selections()[0]['channels']\n daily_js='const DAILY_MUSIC_CHANNELS='+json.dumps({k:{p:sources[k][p] for p in ('name','url')} for k in daily_music.CHANNELS},ensure_ascii=True).replace('<',r'\\u003c')+';\\n'+(ROOT/'catalog/daily-music.js').read_text()\n"+a)
          a="(ROOT/'catalog/ui.js').read_text()+'\\nshell();render();'";change(f,a,"(ROOT/'catalog/ui.js').read_text()+'\\n'+daily_js+'\\nshell();render();'")
          a=" meta['musicVideoAudit']=";change(f,a," meta['dailyMusic']={'schemaVersion':1,'endpoint':'/api/music','reviewedBaseline':len(music['songs']),'registration':'daily-verified-public-uploads'}\n"+a)
          change('catalog/core.js',"remake:'리메이크'});","remake:'리메이크',official_track:'공식 음원·MV'});")
          f='catalog/ui.js';change(f,"e(s.album||'커버 영상')","e(s.album||(s.type==='cover'?'커버 영상':'음악 영상'))");change(f,'</span></div><nav class="catalog-type-tabs"','</span>${CATALOG.music.songs.some(s=>s.type===\'official_track\')?`<span>공식 음원·MV ${CATALOG.music.songs.filter(s=>s.type===\'official_track\').length}</span>`:\'\'}</div><nav class="catalog-type-tabs"')
          f='scripts/daily_music.py';a="            entries=feed_entries(read('https://www.youtube.com/feeds/videos.xml?channel_id='+cid,1048576),cid,now);report['recent']=len(entries)";change(f,a,"            try:\n                entries=feed_entries(read('https://www.youtube.com/feeds/videos.xml?channel_id='+cid,1048576),cid,now);report['transport']='atom'\n            except (OSError,ValueError,ET.ParseError):\n                from daily_music_listing import public_rows\n                entries=public_rows(cid,k,now,report,ids)\n            report['recent']=len(entries)")
          f='auth/Gateway.php';a="        if ($path === '/api/schedule') {";change(f,a,"""        if ($path === '/api/music') {
                      // The existing account/maintenance gate above applies exactly as for /api/schedule.
                      $file = $this->root . '/.music-feed/current.json';
                      if (is_file($file) && !is_link($file) && realpath($file) === $file && filesize($file) <= 1500000) {
                          try {
                              $raw = file_get_contents($file);
                              $feed = json_decode($raw, true, 16, JSON_THROW_ON_ERROR);
                              if (($feed['schemaVersion'] ?? null) === 1 && ($feed['feed'] ?? null) === 'daily-music' && is_array($feed['rows'] ?? null)) {
                                  self::respond(200, $raw, 'application/json; charset=utf-8'); return;
                              }
                          } catch (\\Throwable) { /* preserve the built-in music library */ }
                      }
                      self::respond(503, '{"error":"music_unavailable"}', 'application/json; charset=utf-8'); return;
                  }
          """+a)
          f='tests/auth/browser.py';a="            folder=base/'.schedule-feed';";change(f,a,"""            music_folder=base/'.music-feed';music_folder.mkdir(mode=0o700)
                      music_file=music_folder/'current.json';music_doc={'schemaVersion':1,'feed':'daily-music','generatedAt':'2026-11-03T01:00:00Z','rows':[]};music_file.write_text(json.dumps(music_doc))
                      check('music blocked for unauthenticated maintenance visitor',guest.request.get(url+'/api/music').status==503)
                      check('music blocked for maintenance member',member.request.get(url+'/api/music').status==503)
                      check('music feed returned after authorization',owner.request.get(url+'/api/music').json()==music_doc)
                      check('music feed POST rejected',owner.request.post(url+'/api/music',data={}).status==405)
                      music_file.unlink();music_file.symlink_to(private/'accounts.json');check('music symlink not readable',owner.request.get(url+'/api/music').status==503)
                      check('raw music path not accessible',owner.request.get(url+'/.music-feed/current.json').status==404)
          """+a)
          f='scripts/verify_release_v04.py';a="    suites.append(('schedule',";change(f,a,"    suites.append(('daily-music','tests/daily_music_browser.py',{'DAILY_TEST_URL':url,'DAILY_OUT':str(out/'daily-music')}))\n"+a)
          f='tests/daily_music_browser.py';a=";check('reviewed catalog retained',page.evaluate(\"catalogSongs.has('rewind') && catalogSongs.has('daily-TESTmusic_1')\" ) if False else page.locator('.catalog-song-detail').count()==1)";change(f,a,'')
          change('catalog/daily-music.js','&&dailyMusicRoute())render();','&&dailyMusicRoute())render({focus:false,scroll:false});')
          PY
          python -m compileall -q tests/daily_music_browser.py tests/auth/browser.py scripts && php -l auth/Gateway.php
          python -m unittest discover -s tests -p 'test_*.py' -q
          npm test > /tmp/js-checks && tail -10 /tmp/js-checks
      - name: Verify public collection and source classification without any production credentials
        run: |
          python -m pip install pillow==11.3.0
          python scripts/daily_music.py
      - name: Promote only implementation files in the feature branch, not the one-time probes
        run: |
          git rm .github/workflows/music-{source-scope-inspect,readonly-candidate,atom-check,integrate-once}.yml
          git add auth/Gateway.php catalog/core.js catalog/ui.js catalog/daily-music.js scripts/daily_music.py scripts/enhance_catalog.py scripts/verify_release_v04.py tests/auth/browser.py tests/daily_music_browser.py
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate validated music data into the music page and protected gateway; retain existing catalog on outage'
          git push origin HEAD:feature/daily-music-catalog
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: verified-daily-source-report, path: music-discovery.json, retention-days: 7}
