name: Batch monitoring - bounded freshness recovery
on:
  schedule:
    - cron: '4,24,44 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: isegye-monitoring-health
  cancel-in-progress: false
jobs:
  health:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: main, persist-credentials: false}
      - name: Check freshness and recover only the monitor with bounded requests
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_PAUSED: ${{ vars.PRODUCTION_PAUSED }}
          ISEGYE_MONITOR_PAUSED: ${{ vars.ISEGYE_MONITOR_PAUSED }}
        run: python scripts/batch_monitor_recovery.py --apply
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: batch-monitor-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: batch-monitor-recovery.json
          retention-days: 30
# No SFTP credential and no production files. Only batch-monitoring.yml may be dispatched.
# This is a separate checker, not an independent-of-GitHub scheduler.
