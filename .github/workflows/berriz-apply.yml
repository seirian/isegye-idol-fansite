name: Assemble Berriz official-source feature
on:
  push:
    branches: [feature/berriz-official]
    paths: [.github/workflows/berriz-apply.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/feature/berriz-official'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/berriz-official
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply reviewed source transformations
        run: |
          mkdir -p /tmp/berriz-result
          python scripts/prepare_berriz_integration.py
          python scripts/prepare_berriz_ui.py
          npm test > /tmp/berriz-result/node-tests.txt 2>&1
          python -m unittest discover -s tests -p 'test_*.py' -v > /tmp/berriz-result/python-tests.txt 2>&1
      - name: Install public browser only
        run: |
          python -m venv /tmp/berriz-tools
          /tmp/berriz-tools/bin/pip install playwright==1.56.0
          bash scripts/ci_browser_install.sh /tmp/berriz-tools/bin/python
      - name: Verify real official sources without credentials
        run: |
          /tmp/berriz-tools/bin/python scripts/schedule_feed.py --previous schedule/snapshot.json
          cp schedule/snapshot.json /tmp/berriz-result/snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('schedule/snapshot.json').read_text())
          states={s['id']:s for s in d['sources'] if s['id'].startswith('berriz-')}
          report={'generatedAt':d['generatedAt'],'sources':states,'counts':{sid:sum(x['sourceId']==sid for k in ('news','events') for x in d[k]) for sid in states},'loginUsed':False,'secretAccess':False}
          Path('/tmp/berriz-result/collection.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          assert len(states)==2 and all(s['state']=='ok' for s in states.values()), 'Both public Berriz sources must be verified'
          PY
      - name: Limit changes and remove one-use helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess,json
          keep=['.github/workflows/ci.yml','.github/workflows/production.yml','.github/workflows/schedule-refresh.yml','scripts/schedule_feed.py','scripts/notice_policy.py','scripts/publish_schedule_feed.py','scripts/verify_release_v04.py','scripts/compose_schedule.py','schedule/core.js','schedule/ui.js','schedule/theme.css','schedule/snapshot.json','review/home-release.json']
          temp=['scripts/prepare_berriz_integration.py','scripts/prepare_berriz_ui.py','.github/workflows/berriz-inspect.yml','.github/workflows/berriz-apply.yml']
          for path in temp:Path(path).unlink()
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert set(changed)<=set(keep+temp), changed
          for path in ['schedule/approved-notices.json','schedule/notice-history-coverage.json','auth/Gateway.php','home-review/ui.js','live/ui.js']:
              assert Path(path).read_bytes()==subprocess.check_output(['git','show','HEAD:'+path]), path
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--']+keep+temp,check=True)
          subprocess.run(['git','diff','--cached','--binary','--output=/tmp/berriz-result/feature.patch'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat: integrate public Berriz priority notices and official calendar'],check=True)
          subprocess.run(['git','archive','--format=zip','--output=/tmp/berriz-result/source.zip','HEAD'],check=True)
          Path('/tmp/berriz-result/commit.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'branch':'feature/berriz-official','productionTouched':False}))
          PY
          git push origin HEAD:refs/heads/feature/berriz-official
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: berriz-assembled-feature
          path: /tmp/berriz-result/
          retention-days: 7
