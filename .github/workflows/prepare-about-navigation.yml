name: Prepare About navigation feature
on:
  push:
    branches: [chore/prepare-about-navigation]
    paths: [.github/workflows/prepare-about-navigation.yml, prepare_about_navigation.py]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/chore/prepare-about-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 10
      - name: Apply and verify changes on the feature branch
        run: |
          set -euo pipefail
          cp prepare_about_navigation.py "$RUNNER_TEMP/about-edit.py"
          git switch -c feature/site-about-navigation aca52a59536c46da4ab865a9cffc7480997acb61
          python "$RUNNER_TEMP/about-edit.py"
          node --check legal/ui.js
          php -l auth/View.php
          python -m unittest discover -s tests -p 'test_legal_shell.py'
          python -m unittest discover -s tests -p 'test_home_release.py'
          git diff --check
          git add --update -- auth legal review scripts tests
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove shared beta strip and add 사이트소개 to information tabs and footer'
          git push origin HEAD:refs/heads/feature/site-about-navigation
