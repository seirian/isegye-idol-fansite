name: Batch monitoring - protected read-only review
on:
  push:
    branches: [feature/batch-monitoring, feature/batch-monitoring-ux]
    paths:
      - monitoring/**
      - auth/google-client.js
      - scripts/*batch_monitor*.py
      - tests/*batch_monitor*
      - .github/workflows/batch-monitoring-preview.yml
      - .github/workflows/batch-monitoring.yml
      - .github/workflows/production.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'seirian/isegye-idol-fansite' && (github.ref == 'refs/heads/feature/batch-monitoring' || github.ref == 'refs/heads/feature/batch-monitoring-ux')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Preserve exact credential-free candidate source
        run: git archive HEAD -o batch-monitor-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-monitor-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: batch-monitor-source.tar
          retention-days: 7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Install pinned validation tools without production credentials
        run: |
          python -m venv /tmp/batch-monitor-tools
          /tmp/batch-monitor-tools/bin/pip install pillow==11.3.0 playwright==1.56.0 cryptography==46.0.3 paramiko==5.0.0
          bash scripts/ci_browser_install.sh /tmp/batch-monitor-tools/bin/python
          composer install --working-dir=auth --no-dev --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
          composer audit --working-dir=auth --no-dev
      - name: Verify unchanged policy and read-only monitor
        run: |
          npm test
          /tmp/batch-monitor-tools/bin/python -m unittest discover -s tests -p 'test_batch_watchdog*.py' -v
          /tmp/batch-monitor-tools/bin/python -m unittest discover -s tests -p 'test_batch_monitor*.py' -v
          php -l monitoring/BatchMonitor.php
          node --check monitoring/monitor.js
      - name: Build protected monitor without changing operating source
        run: |
          /tmp/batch-monitor-tools/bin/python scripts/build_batch_monitor_host.py
          php -l auth-bundle/Gateway.php
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-monitor-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: auth-bundle/
          retention-days: 7
          include-hidden-files: true
      - name: Verify guest member admin and desktop mobile UI using synthetic identities
        run: /tmp/batch-monitor-tools/bin/python tests/batch_monitor_host_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: batch-monitor-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/batch-monitor/
          retention-days: 30
          if-no-files-found: warn
# The user approved production promotion on 2026-11-17.
# Feature branches now validate only. Only tested main may publish the monitor.
