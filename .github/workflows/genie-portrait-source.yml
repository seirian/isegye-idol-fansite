name: Inspect user-selected Genie portraits
on:
  push:
    branches: ['feature/readability']
    paths: ['.github/workflows/genie-portrait-source.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/feature/readability'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Export current review source
        run: |
          mkdir -p genie-inspection
          git archive --format=zip --output=genie-inspection/review-source.zip HEAD
      - name: Install public HTML parser
        run: python -m pip install beautifulsoup4==4.13.4 pillow==11.3.0
      - name: Read specified group and six linked public artist pages
        run: |
          python - <<'PY'
          import hashlib, io, json, re, time, urllib.request, urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from PIL import Image
          out=Path('genie-inspection')
          group='https://www.genie.co.kr/detail/artistInfo?xxnm=81287268'
          members={'ine':'아이네','jingburger':'징버거','lilpa':'릴파','jururu':'주르르','gosegu':'고세구','viichan':'비챤'}
          def get(url):
              assert urllib.parse.urlparse(url).hostname in ('www.genie.co.kr','image.genie.co.kr')
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; IsegyeFanReview/1.0)','Referer':group})
              with urllib.request.urlopen(req,timeout=25) as r:
                  assert urllib.parse.urlparse(r.url).hostname in ('www.genie.co.kr','image.genie.co.kr')
                  data=r.read(12*1024*1024+1)
                  assert len(data)<=12*1024*1024
                  return data,r.headers.get_content_charset()
          data,enc=get(group)
          text=data.decode(enc or 'utf-8',errors='replace')
          (out/'group.html').write_text(text,encoding='utf-8')
          soup=BeautifulSoup(text,'html.parser')
          report={'sourcePage':group,'checkedAt':datetime.now(timezone.utc).isoformat(),'members':[]}
          for mid,name in members.items():
              item={'id':mid,'name':name}
              anchors=[a for a in soup.select('a') if a.get_text(strip=True)==name]
              found=[]
              for a in anchors:
                  raw=' '.join(str(a.get(k,'')) for k in ('href','onclick'))
                  match=re.search(r'(?:fnViewArtist\s*\(\s*[\'\"]?|xxnm=)(\d+)',raw)
                  if match:found.append(match.group(1))
              found=list(dict.fromkeys(found))
              assert len(found)==1, (name,'Ambiguous member artist link',found)
              aid=found[0]
              url='https://www.genie.co.kr/detail/artistInfo?xxnm='+aid
              body,enc=get(url)
              html=body.decode(enc or 'utf-8',errors='replace')
              (out/(mid+'.html')).write_text(html,encoding='utf-8')
              page=BeautifulSoup(html,'html.parser')
              item.update(artistId=aid,sourcePage=url,title=page.title.get_text() if page.title else '',candidates=[])
              candidates={}
              for im in page.select('img'):
                  src=im.get('src','')
                  if 'IMG_ARTIST' in src and aid in src:
                      full=urllib.parse.urljoin(url,src)
                      original=full.split('/dims/')[0]
                      candidates[original]={'displayUrl':full,'alt':im.get('alt',''),'imageElement':str(im),'parent':str(im.parent)[:2500]}
              for i,(original,context) in enumerate(candidates.items()):
                  try:
                      image,_=get(original)
                      with Image.open(io.BytesIO(image)) as img:
                          size=list(img.size);fmt=img.format
                      filename=mid+'-'+str(i)+'.'+('png' if fmt=='PNG' else 'webp' if fmt=='WEBP' else 'jpg')
                      (out/filename).write_bytes(image)
                      item['candidates'].append(dict(context,originalUrl=original,file=filename,dimensions=size,format=fmt,sha256=hashlib.sha256(image).hexdigest()))
                  except Exception as exc:
                      item['candidates'].append(dict(context,originalUrl=original,error=type(exc).__name__))
              report['members'].append(item)
              time.sleep(.3)
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Save public source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genie-portrait-source-${{ github.run_id }}
          path: genie-inspection/
          retention-days: 14
