name: Albums approved promotion source
on:
  push:
    branches: ['release/albums-approved']
    paths: ['.github/workflows/albums-promotion-source.yml']
permissions: {contents: read}
jobs:
  source:
    if: github.ref == 'refs/heads/release/albums-approved'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: git archive --format=zip --output=albums-promotion-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: albums-promotion-source-${{ github.sha }}
          path: albums-promotion-source.zip
          retention-days: 7
