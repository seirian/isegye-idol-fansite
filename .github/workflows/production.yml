name: Production - isolated inour SFTP deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isegye-inour-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://isegye-idol.kr/
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Respect production pause control
        env:
          PRODUCTION_PAUSED: ${{ vars.PRODUCTION_PAUSED }}
        run: test "$PRODUCTION_PAUSED" != 'true'
      - name: Validate registered Google Web Client ID
        env:
          ISEGYE_GOOGLE_CLIENT_ID: ${{ vars.ISEGYE_GOOGLE_CLIENT_ID || secrets.ISEGYE_GOOGLE_CLIENT_ID }}
        run: |
          python -c "import os,re; assert re.fullmatch(r'[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com',os.environ.get('ISEGYE_GOOGLE_CLIENT_ID','').strip()), 'Google Web Client ID missing or malformed'; print('Registered client identifier format verified; value not logged')"
      - name: Install and verify pinned authentication library
        run: |
          composer install --working-dir=auth --no-dev --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
          composer audit --working-dir=auth --no-dev
          php tests/auth/store_test.php
          php tests/auth/jwt_test.php
      - name: Validate source, isolation and rollback
        run: |
          python -m pip install tinycss2==1.4.0 beautifulsoup4==4.14.3 pillow==11.3.0
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install isolated build and browser tools
        timeout-minutes: 6
        run: |
          python -m venv /tmp/archive-browser-tests
          /tmp/archive-browser-tests/bin/pip install playwright==1.56.0 paramiko==5.0.0 pillow==11.3.0 tinycss2==1.4.0 beautifulsoup4==4.14.3 cryptography
          bash scripts/ci_browser_install.sh /tmp/archive-browser-tests/bin/python
      - name: Verify authentication using local test identities only
        run: /tmp/archive-browser-tests/bin/python tests/auth/browser.py
      - name: Build credential-free authentication runtime
        run: python scripts/build_albums_host.py
      - name: Refresh public data and verify reviewed music sources
        run: |
          /tmp/archive-browser-tests/bin/python scripts/refresh_catalog_videos.py
          /tmp/archive-browser-tests/bin/python scripts/check_music_video_sources.py
          /tmp/archive-browser-tests/bin/python scripts/schedule_feed.py --previous schedule/snapshot.json
      - name: Restore the exact approved public album snapshot
        run: /tmp/archive-browser-tests/bin/python scripts/prepare_album_release.py
      - name: Build approved simple home with LIVE preserved
        run: ISEGYE_BASELINE_ONLY=true npm run build
        env:
          PYTHON: /tmp/archive-browser-tests/bin/python
          DEPLOY_ENV: production
      - name: Verify exact production bundle before any upload
        env:
          RELEASE_MODE: production
          RELEASE_OUT: test-results/production-candidate
        run: /tmp/archive-browser-tests/bin/python scripts/verify_release_v04.py
      - name: Promote the approved final second review to the operating site
        env:
          DEPLOY_ENV: production
        run: /tmp/archive-browser-tests/bin/python scripts/promote_review_2nd.py
      - name: Verify promoted menus and existing runtime feed connections
        run: /tmp/archive-browser-tests/bin/python scripts/verify_promoted_review.py
      - name: Verify preserved first and second preview authentication
        run: /tmp/archive-browser-tests/bin/python tests/review_2nd_host_browser.py
      - name: Promote and test the approved final album UI
        run: |
          /tmp/archive-browser-tests/bin/python scripts/promote_albums.py
          /tmp/archive-browser-tests/bin/python tests/albums_production_browser.py
          python scripts/build_albums_host.py
      - name: Verify album feed and image authorization before any upload
        run: /tmp/archive-browser-tests/bin/python tests/albums_feed_browser.py
      - name: Activate Google access without pre-registering the administrator
        run: /tmp/archive-browser-tests/bin/python -u scripts/deploy_verified_albums.py
        env:
          PRODUCTION_ENABLED: 'true'
          PRODUCTION_PAUSED: ${{ vars.PRODUCTION_PAUSED }}
          ISEGYE_SFTP_PASSWORD: ${{ secrets.ISEGYE_SFTP_PASSWORD }}
          ISEGYE_GOOGLE_CLIENT_ID: ${{ vars.ISEGYE_GOOGLE_CLIENT_ID || secrets.ISEGYE_GOOGLE_CLIENT_ID }}
      - name: Archive deployed source
        if: always()
        run: git archive HEAD -o release-source.tar
      - name: Save credential-free release report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isegye-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            auth-deployment.json
            release-source.tar
            dist/build-info.json
            schedule/snapshot.json
            test-results/
          if-no-files-found: warn
          retention-days: 30
