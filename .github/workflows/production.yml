name: Production - isolated inour SFTP deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isegye-inour-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate content and deployment boundaries
        run: |
          npm test
          python -m unittest discover -s tests -p test_deployment.py -v
      - run: npm run build
        env:
          DEPLOY_ENV: production
      - name: Browser check before any upload
        run: |
          python -m venv /tmp/archive-browser-tests
          /tmp/archive-browser-tests/bin/pip install playwright==1.56.0 paramiko==5.0.0
          /tmp/archive-browser-tests/bin/python -m playwright install --with-deps chromium
          /tmp/archive-browser-tests/bin/python tests/browser_smoke.py
      - name: Prove isolated document root and deploy only inside it
        run: /tmp/archive-browser-tests/bin/python scripts/inour_sftp.py
        env:
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_ENABLED }}
          ISEGYE_INITIALIZE_EMPTY_ROOT: ${{ vars.ISEGYE_INITIALIZE_EMPTY_ROOT }}
          ISEGYE_SFTP_PASSWORD: ${{ secrets.ISEGYE_SFTP_PASSWORD || secrets.YEOP_SFTP_PASSWORD }}
      - name: Save credential-free deployment result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isegye-inour-deployment-${{ github.run_id }}
          path: inour-report.json
          retention-days: 30
