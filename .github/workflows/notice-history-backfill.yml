name: Approved notices - one-time public listing history
on:
  push:
    branches: ['feature/approved-notice-history']
    paths: ['.github/workflows/notice-history-backfill.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python -m venv /tmp/notices
          /tmp/notices/bin/pip install playwright==1.56.0
          bash scripts/ci_browser_install.sh /tmp/notices/bin/python
          /tmp/notices/bin/python - <<'PY'
          import json,time,re,hashlib,math
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          from urllib.parse import urlsplit,parse_qs
          from playwright.sync_api import sync_playwright
          KST=timezone(timedelta(hours=9));start='2021-08-26';end=datetime.now(KST).date().isoformat()
          aliases={'아이네':'ine','아이네 INE':'ine','징버거':'jingburger','릴파 LILPA':'lilpa','릴파':'lilpa','주르르':'jururu','고세구':'gosegu','비챤':'viichan'}
          out=Path('notice-history');out.mkdir(exist_ok=True)
          report={'checkedAt':datetime.now(timezone.utc).isoformat(),'rangeStart':start,'rangeEnd':end,'method':'one_time_public_board_navigation','loginUsed':False,'articleBodiesRead':False,'commentsStored':False,'pages':[],'boards':[],'excludedCounts':{},'complete':False}
          accepted={}
          def excluded(reason):report['excludedCounts'][reason]=report['excludedCounts'].get(reason,0)+1
          def save():
              rows=sorted(accepted.values(),key=lambda x:(x['publishedAt'],x['articleId']))
              (out/'notices.json').write_text(json.dumps({'schemaVersion':1,'checkedAt':report['checkedAt'],'rangeStart':start,'rangeEnd':end,'notices':rows},ensure_ascii=False,separators=(',',':'))+'\n')
              report['acceptedCount']=len(rows);report['earliest']=rows[0]['publishedAt'] if rows else None;report['latest']=rows[-1]['publishedAt'] if rows else None
              (out/'coverage.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          with sync_playwright() as p:
              b=p.chromium.launch();c=b.new_context(locale='ko-KR');page=c.new_page()
              page.route('**/*',lambda r:r.abort() if r.request.resource_type in ('image','media','font') else r.continue_())
              for menu in (345,1250):
                  board={'menu':menu,'pagesRead':0,'rowsSeen':0,'finished':False};report['boards'].append(board)
                  previous_signature=None
                  for number in range(1,501):
                      endpoint=f'/cafes/27842958/menus/{menu}/articles?'
                      u=f'https://cafe.naver.com/f-e/cafes/27842958/menus/{menu}?page={number}&pageSize=50&viewType=L'
                      try:
                          with page.expect_response(lambda r:endpoint in r.url and parse_qs(urlsplit(r.url).query).get('page',['1'])[0]==str(number),timeout=30000) as awaited:
                              nav=page.goto(u,wait_until='domcontentloaded',timeout=30000)
                          response=awaited.value
                          if response.status!=200:raise RuntimeError('public_listing_http_'+str(response.status))
                          data=response.json();result=data.get('result',{});entries=result.get('articleList')
                          if not isinstance(entries,list):raise RuntimeError('listing_schema_or_access_changed')
                          info=result.get('pageInfo',{})
                          rows=[x.get('item',{}) for x in entries if x.get('item',{}).get('articleId')]
                          signature=hashlib.sha256(json.dumps([x['articleId'] for x in rows]).encode()).hexdigest()
                          if previous_signature==signature and rows:raise RuntimeError('repeated_page_stop')
                          previous_signature=signature
                          size=int(parse_qs(urlsplit(response.url).query).get('pageSize',['15'])[0])
                          board.update(pagesRead=number,rowsSeen=board['rowsSeen']+len(rows),pageSize=size,lastPageInfo=info)
                          report['pages'].append({'menu':menu,'page':number,'rowCount':len(rows),'signature':signature,'first':rows[0]['articleId'] if rows else None,'last':rows[-1]['articleId'] if rows else None})
                          for x in rows:
                              w=x.get('writerInfo',{});name=str(w.get('nickName','')).strip();member=aliases.get(name)
                              if x.get('cafeId')!=27842958 or x.get('menuId')!=menu:excluded('other_board');continue
                              if x.get('openArticle') is not True or x.get('restrictMenu') is True:excluded('not_public');continue
                              if menu==345:
                                  if not member or w.get('staff') is not True:excluded('unapproved_author');continue
                              else:
                                  if name!='parable' or not (w.get('manager') is True or w.get('staff') is True):excluded('unapproved_agency_author');continue
                              try:published=datetime.fromtimestamp(x['writeDateTimestamp']/1000,timezone.utc);day=published.astimezone(KST).date().isoformat()
                              except Exception:excluded('invalid_date');continue
                              if not start<=day<=end:excluded('outside_range');continue
                              title=re.sub(r'\s+',' ',str(x.get('subject',''))).strip()[:220]
                              if not title:excluded('missing_title');continue
                              if menu==1250 and not re.search('이세계|이세돌|아이네|징버거|릴파|주르르|고세구|비챤|ISEGYE',title,re.I):excluded('other_agency_topic');continue
                              # No personal medical reason is archived; retain only neutral notice metadata.
                              redacted=bool(re.search('병원|진단|우울증|공황|코로나|독감|장염|생리|수술|치료|건강검진',title))
                              if redacted:title='휴방 관련 공지' if re.search('휴뱅|휴방|휴르르',title) else '멤버 공지 (세부 내용은 원문 확인)'
                              aid=x['articleId'];members=[member] if member else [v for k,v in aliases.items() if k.split()[0] in title]
                              if menu==1250 and (re.search('이세계|이세돌|ISEGYE',title,re.I) or not members):members=['ine','jingburger','lilpa','jururu','gosegu','viichan']
                              accepted[aid]={'articleId':aid,'menuId':menu,'author':member or 'parable','members':list(dict.fromkeys(members)),'title':title,'publishedAt':published.isoformat(timespec='milliseconds'),'verifiedRole':'staff' if menu==345 else 'manager' if w.get('manager') else 'staff','public':True,'titleGeneralized':redacted}
                          save()
                          if not rows or len(rows)<size:
                              board['finished']=True;break
                          print(json.dumps({'menu':menu,'page':number,'accepted':len(accepted)}),flush=True)
                          time.sleep(1.25)
                      except Exception as err:
                          board['stoppedAtPage']=number;board['stopReason']=type(err).__name__+':'+str(err).splitlines()[0][:100];save();break
                  if not board['finished']:break
              report['complete']=len(report['boards'])==2 and all(x['finished'] for x in report['boards']);save();b.close()
          print(json.dumps({k:v for k,v in report.items() if k not in ('pages',)},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approved-notice-history-${{ github.run_id }}
          path: notice-history/
          retention-days: 7
