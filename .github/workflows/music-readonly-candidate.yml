name: Daily music source smoke test (feature only)
on:
  push:
    branches: [feature/daily-music-catalog]
    paths: [.github/workflows/music-readonly-candidate.yml]
permissions: {contents: read}
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python -m pip install pillow==11.3.0 && python scripts/daily_music.py
      - run: python scripts/check_music_video_sources.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: music-dry-run
          path: |
            music-discovery.json
            test-results/music-sources/source-audit.json
