name: Assemble reviewed toolbar changes
on:
  push:
    branches: [feature/schedule-toolbar]
    paths: [.github/workflows/toolbar-apply.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/feature/schedule-toolbar'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply exact source edits with before and after checksums
        run: |
          python - <<'PY'
          import base64,zlib,json,hashlib
          from pathlib import Path
          packed=Path('.maintenance/toolbar-edits.b64').read_text().strip()
          # Correct four transcription errors in the temporary transport only.
          for a,b in [('BT1TUpg','BT1Upg'),('AFUElpFn','AFUEUpFn'),('y6TW4q','y6bi4q'),('ndyC2O2','ndy2O2')]: packed=packed.replace(a,b)
          raw=zlib.decompress(base64.b64decode(packed))
          assert hashlib.sha256(raw).hexdigest()=='460dd884c5952585c28d02077d9b7b2e126a837fe9779f0794cf6d1d2829763d', 'Source transport checksum mismatch'
          edits=json.loads(raw)
          allowed=('schedule/','home-review/','tests/','scripts/','docs/','review/home-release.json','.github/workflows/toolbar-source.yml')
          for name,item in edits.items():
              assert name.startswith(allowed) and '..' not in name.split('/')
              p=Path(name); old=p.read_bytes() if p.exists() else b''
              assert hashlib.sha256(old).hexdigest()==item['before'], 'Source changed: '+name
              if item.get('delete'):
                  p.unlink();continue
              text=old.decode()
              for start,end,replacement in reversed(item['ops']):text=text[:start]+replacement+text[end:]
              new=text.encode();assert hashlib.sha256(new).hexdigest()==item['after'], 'Result differs: '+name
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(new)
          names=list(edits)+['.maintenance/toolbar-edits.b64','.github/workflows/toolbar-apply.yml']
          Path('changed-source-paths.json').write_text(json.dumps(names))
          for name in names[-2:]:Path(name).unlink()
          print('Verified UI-only source edits:',len(edits))
          PY
      - name: Run source and regression tests
        run: |
          npm test > toolbar-node-tests.txt 2>&1
          python -m unittest discover -s tests -p 'test_*.py' -v > toolbar-python-tests.txt 2>&1
          git diff --check
      - name: Create reviewable Git objects only, do not move any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import os,json,base64,subprocess
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='seirian/isegye-idol-fansite'
          def post(path,data):
              req=Request('https://api.github.com/repos/'+repo+path,data=json.dumps(data).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urlopen(req,timeout=30) as r:return json.load(r)
          parent=os.environ['GITHUB_SHA'];base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          entries=[]
          for name in json.loads(Path('changed-source-paths.json').read_text()):
              p=Path(name)
              sha=post('/git/blobs',{'content':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'})['sha'] if p.exists() else None
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          tree=post('/git/trees',{'base_tree':base,'tree':entries})['sha']
          commit=post('/git/commits',{'message':'Refine calendar toolbar and relocate fan guide to compact footer','tree':tree,'parents':[parent]})['sha']
          report={'parent':parent,'tree':tree,'commit':commit,'branchMoved':False,'productionTouched':False,'files':len(entries)}
          Path('toolbar-assembly.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: toolbar-assembly
          path: |
            toolbar-assembly.json
            toolbar-node-tests.txt
            toolbar-python-tests.txt
          retention-days: 3
