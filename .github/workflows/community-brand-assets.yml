name: Inspect official community brand assets
on:
  push:
    branches: [feature/community-shortcuts]
    paths: [.github/workflows/community-brand-assets.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public logo assets only
        run: |
          python - <<'PY'
          import json,re,hashlib
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import urljoin,urlparse
          out=Path('community-brand-assets');out.mkdir()
          report=[]
          def read(url,name):
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
                  data=r.read(3000000);mime=r.headers.get_content_type();final=r.url
              (out/name).write_bytes(data)
              report.append({'url':url,'finalUrl':final,'file':name,'contentType':mime,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
              return data
          class Icons(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='link' and 'icon' in a.get('rel','').lower() and a.get('href'):self.links.append(a)
          for key,url in [('berriz','https://berriz.in/ko/explore'),('naver','https://section.cafe.naver.com/')]:
              try:
                  html=read(url,key+'-public.html').decode('utf-8','replace');p=Icons();p.feed(html)
                  (out/(key+'-icons.json')).write_text(json.dumps(p.links,ensure_ascii=False,indent=2))
                  for i,link in enumerate(p.links[:6]):
                      asset=urljoin(url,link['href']);host=urlparse(asset).hostname or ''
                      if not any(host==d or host.endswith('.'+d) for d in ['berriz.in','naver.com','pstatic.net']):continue
                      try:read(asset,key+'-icon-'+str(i)+'.asset')
                      except Exception as e:report.append({'url':asset,'error':str(e)[:200]})
                  for i,a in enumerate(re.findall(r'<a\b[^>]*>.*?</a>',html,re.S)):
                      if 'logo_click' in a:
                          for j,svg in enumerate(re.findall(r'<svg\b.*?</svg>',a,re.S)):(out/(key+'-logo-'+str(i)+'-'+str(j)+'.svg')).write_text(svg)
              except Exception as e:report.append({'url':url,'error':str(e)[:200]})
          for url,name in [('https://developers.naver.com/inc/devcenter/images/cont/img_cafeapp.png','naver-official-guide.png'),('https://developers.naver.com/inc/devcenter/downloads/NAVERCafeIcons.zip','NAVERCafeIcons.zip')]:
              try:read(url,name)
              except Exception as e:report.append({'url':url,'error':str(e)[:200]})
          (out/'sources.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-community-brand-assets
          path: community-brand-assets/
          retention-days: 14
