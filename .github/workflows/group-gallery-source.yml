name: Group gallery source inspection
on:
  push:
    branches: [feature/home-search-gallery]
    paths: [.github/workflows/group-gallery-source.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install pillow==11.3.0
      - name: Read public image sources without credentials
        run: |
          mkdir -p gallery-inspection
          python - <<'PY'
          import urllib.request, hashlib, json, io
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw
          urls={
            'mafia':'https://cdn.kpopping.com/kpics/2026/06/1781627727652-04dqj7-0.png',
            'christmas':'https://cdn.kpopping.com/kpics/2026/06/1781630020889-7crh4z-0.jpg',
            'pastel':'https://cdn.kpopping.com/kpics/2026/06/1781630640449-jits8e-0.png',
            'hanteo':'https://legacy.kpopping.com/ca/1/251209-HANTEO-NEWS-Twitter-Update-with-ISEGYE-IDOL-documents-1.jpeg',
            'rewind':'https://isegye-festival.com/wp-content/uploads/2024/05/maxresdefault-1.jpg',
            'bml-teaser':'https://pbs.twimg.com/media/G3dMnEQX0AA6_uL.jpg?name=orig',
            'smile':'https://images.khan.co.kr/article/2026/06/19/news-p.v1.20260619.3b44512145de46ea90ae6b8626f2b9bb_P1.png',
            'genie':'https://image.genie.co.kr/Y/IMAGE/IMG_MUZICAT/IV2/Genie_Magazine/15690/Mgz_Sub_IMG_20251030140059.jpg'
          }
          out=Path('gallery-inspection'); report=[]; thumbs=[]
          for name,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=25) as response: raw=response.read(25*1024*1024)
              im=Image.open(io.BytesIO(raw)); im.load()
              row={'id':name,'url':url,'width':im.width,'height':im.height,'format':im.format,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
              (out/(name+'.'+im.format.lower())).write_bytes(raw)
              thumb=ImageOps.contain(im.convert('RGB'),(560,315)); canvas=Image.new('RGB',(580,350),'#eee');canvas.paste(thumb,((580-thumb.width)//2,5));ImageDraw.Draw(canvas).text((10,325),name+' '+str(im.size),fill='#111');thumbs.append(canvas)
              print(json.dumps(row));report.append(row)
            except Exception as exc: report.append({'id':name,'url':url,'error':str(exc)});print(name,str(exc))
          sheet=Image.new('RGB',(1160,350*((len(thumbs)+1)//2)),'white')
          for i,im in enumerate(thumbs):sheet.paste(im,((i%2)*580,(i//2)*350))
          sheet.save(out/'contact-sheet.jpg')
          (out/'sources.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: group-gallery-sources
          path: gallery-inspection/
          retention-days: 7
