name: Schedule source contract inspection
on:
  push:
    branches: ['feature/schedule-feed']
    paths: ['.github/workflows/schedule-source-detail.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python -m venv /tmp/schedule-tools
          /tmp/schedule-tools/bin/pip install playwright==1.56.0
          bash scripts/ci_browser_install.sh /tmp/schedule-tools/bin/python
          mkdir -p contract
          /tmp/schedule-tools/bin/python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('contract'); data={'robots':{},'lists':[],'articles':[],'responses':[]}
          for host in ['apis.naver.com','parable-asia.com']:
              try:
                  with urllib.request.urlopen('https://'+host+'/robots.txt',timeout=20) as r:data['robots'][host]={'status':r.status,'text':r.read(20000).decode(errors='replace')}
              except Exception as e:data['robots'][host]={'error':str(e)[:150]}
          with sync_playwright() as p:
              b=p.chromium.launch();c=b.new_context(locale='ko-KR');page=c.new_page()
              for menu in (345,1250):
                  u=f'https://apis.naver.com/cafe-web/cafe-boardlist-api/v1/cafes/27842958/menus/{menu}/articles?page=1&pageSize=15&sortBy=TIME&viewType=L'
                  try:
                      r=c.request.get(u,timeout=25000); v=r.json()
                      rows=[]
                      for entry in v.get('result',{}).get('articleList',[]):
                          x=entry.get('item',{});w=x.get('writerInfo',{})
                          rows.append({k:x.get(k) for k in ('articleId','cafeId','menuId','subject','writeDateTimestamp','openArticle','restrictMenu','readLevel') }|{'writer':{k:w.get(k) for k in ('nickName','staff','manager','memberLevelName')}})
                      data['lists'].append({'menu':menu,'status':r.status,'rows':rows})
                  except Exception as e:data['lists'].append({'menu':menu,'error':type(e).__name__})
              def response(r):
                  if 'apis.naver.com/cafe-web/' in r.url and ('/articles/' in r.url or 'ArticleRead' in r.url):
                      try:
                          v=r.json()
                          def shape(x,depth=0):
                              if depth>4:return type(x).__name__
                              if isinstance(x,dict):return {k:shape(val,depth+1) for k,val in x.items() if k.lower() not in ('memberkey','memberid','userid','email','ip','token')}
                              if isinstance(x,list):return [shape(val,depth+1) for val in x[:1]]
                              return type(x).__name__
                          data['responses'].append({'url':r.url,'status':r.status,'shape':shape(v)})
                      except Exception:pass
              page.on('response',response)
              for aid in (22137397,22136013,22058071,22096118):
                  try:
                      r=page.goto(f'https://cafe.naver.com/f-e/cafes/27842958/articles/{aid}',wait_until='domcontentloaded',timeout=30000);page.wait_for_timeout(2500)
                      entry={'id':aid,'status':r.status,'frames':[]}
                      for frame in page.frames:
                          if '/articles/' not in frame.url:continue
                          text=frame.locator('.ArticleContentBox, .article_container, article').first
                          if text.count():
                              entry['frames'].append({'url':frame.url,'html':text.inner_html()[:28000],'text':text.inner_text()[:5000]})
                          else:entry['frames'].append({'url':frame.url,'text':frame.locator('body').inner_text()[:3000]})
                      data['articles'].append(entry)
                  except Exception as e:data['articles'].append({'id':aid,'error':type(e).__name__})
              b.close()
          (out/'contract.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: schedule-contract-${{ github.run_id }}
          path: contract/
          retention-days: 3
