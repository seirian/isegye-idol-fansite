name: Toolbar source snapshot
on:
  push:
    branches: [feature/schedule-toolbar]
    paths: [.github/workflows/toolbar-source.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/feature/schedule-toolbar'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Package tracked public source only
        run: git archive --format=tar HEAD > toolbar-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolbar-source
          path: toolbar-source.tar
          retention-days: 1
