name: Albums - one-time verified release history repair
on:
  workflow_run:
    workflows: ['Production - isolated inour SFTP deployment']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isegye-inour-production
  cancel-in-progress: false
  queue: max
jobs:
  repair:
    if: >-
      github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(github.event.workflow_run.head_commit.message, '[album-history-20261116]')))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Preserve existing pause controls
        env:
          PRODUCTION_PAUSED: ${{ vars.PRODUCTION_PAUSED }}
          ISEGYE_ALBUMS_PAUSED: ${{ vars.ISEGYE_ALBUMS_PAUSED }}
        run: test "$PRODUCTION_PAUSED" != true && test "$ISEGYE_ALBUMS_PAUSED" != true
      - name: Install isolated verified transfer dependencies
        run: |
          python -m venv /tmp/album-history
          /tmp/album-history/bin/pip install beautifulsoup4==4.14.3 pillow==11.3.0 paramiko==5.0.0
      - name: Test identities, retention, conflict and publication boundaries
        run: |
          /tmp/album-history/bin/python -m unittest discover -s tests -p 'test_album_history_backfill.py' -v
          node --test tests/album-history.test.js
          rm -f album-history-report.json album-history-before.json album-history-after.json
      - name: Repair verified historical observations without source-clock changes
        env:
          PRODUCTION_PAUSED: ${{ vars.PRODUCTION_PAUSED }}
          ISEGYE_ALBUMS_PAUSED: ${{ vars.ISEGYE_ALBUMS_PAUSED }}
          ISEGYE_SFTP_PASSWORD: ${{ secrets.ISEGYE_SFTP_PASSWORD }}
        run: /tmp/album-history/bin/python scripts/album_history_backfill.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: album-history-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            album-history-report.json
            album-history-before.json
            album-history-after.json
          retention-days: 30
