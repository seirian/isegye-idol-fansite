name: Albums review source snapshot
on:
  push:
    branches: ['feature/albums']
    paths: ['.github/workflows/albums-source.yml']
permissions: {contents: read}
jobs:
  source:
    if: github.ref == 'refs/heads/feature/albums'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Read album report identity and public track selector
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          import json,time
          out=Path('test-results/albums-melon-contract');out.mkdir(parents=True,exist_ok=True)
          dates={'10815040':'202112171800','10889597':'202203111800','11308283':'202308181800','11786572':'202504251800','11810611':'202505181800','12187919':'202511031800','12449013':'202512191800','13745404':'202606191800','11269236':'202306221800','11290352':'202307211800','11744103':'202503201800','11332440':'202309241800','14547786':'202609281800'}
          urls=[('hall-'+x,'https://m2.melon.com/melonhall/sector/album/report.htm?albumId='+x+'&issueDate='+d) for x,d in dates.items()]+[('millions','https://m2.melon.com/melonhall/sector/album/millions.htm'),('selector','https://isegyechart.com/_astro/FeaturedSongSelectorIsland.2bPfPvn-.js')]
          report=[]
          for name,url in urls:
              try:
                  with urlopen(Request(url,headers={'User-Agent':'ISEGYE-Archive-Review/1.0'}),timeout=20) as res:body=res.read(4000000);final=res.url
                  (out/(name+'.txt')).write_bytes(body);report.append({'name':name,'url':url,'final':final,'size':len(body)})
              except Exception as exc:report.append({'name':name,'url':url,'error':type(exc).__name__})
              time.sleep(.5)
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - run: git archive --format=zip --output=albums-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: albums-source-${{ github.sha }}
          path: |
            albums-source.zip
            test-results/albums-melon-contract/
          retention-days: 7
