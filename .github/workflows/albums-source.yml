name: Albums review source snapshot
on:
  push:
    branches: ['feature/albums']
    paths: ['.github/workflows/albums-source.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/feature/albums'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          python -m venv /tmp/albums-tools
          /tmp/albums-tools/bin/pip install pillow==11.3.0 tinycss2==1.4.0
          PYTHON=/tmp/albums-tools/bin/python npm run build
      - name: Export tracked feature source for second-feedback review
        run: git archive --format=zip --output=albums-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: albums-source-${{ github.sha }}
          path: |
            albums-source.zip
            dist/
            home-dist/
            release-review-2nd/
          retention-days: 7
