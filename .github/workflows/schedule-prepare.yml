name: Prepare calendar-first schedule source
on:
  push:
    branches: ['feature/schedule-feed']
    paths: ['.github/workflows/schedule-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply verified source-only patch within exact path allowlist
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,re,subprocess
          parts=[Path(f'review/schedule-transfer-{i}.b64') for i in range(6)]
          raw=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True),memlimit=268435456)
          assert hashlib.sha256(raw).hexdigest()=='01258490468198ffc9ad5e971ac0404018388df0b1bdf8d576c8a9298fd4401b','Source checksum mismatch'
          allowed={'auth/Gateway.php','docs/SCHEDULE-INGESTION.md','review/home-release.json','schedule/core.js','schedule/seed.json','schedule/snapshot.json','schedule/theme.css','schedule/ui.js','scripts/build_home_review.py','scripts/compose_schedule.py','scripts/publish_schedule_feed.py','scripts/schedule_feed.py','scripts/verify_release_v04.py','tests/auth/browser.py','tests/auth/production_browser.py','tests/schedule.test.js','tests/schedule_browser.py','tests/test_schedule_feed.py'}
          entries=re.findall(r'^diff --git a/(\S+) b/(\S+)$',raw.decode(),re.M)
          assert {a for a,b in entries}==allowed and all(a==b for a,b in entries),'Unexpected source paths'
          subprocess.run(['git','apply','--check','-'],input=raw,check=True)
          subprocess.run(['git','apply','-'],input=raw,check=True)
          for p in parts:p.unlink()
          subprocess.run(['git','add','--',*sorted(allowed),*[str(p) for p in parts]],check=True)
          PY
          git diff --cached --check
          php -l auth/Gateway.php
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit and push only the unchanged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(schedule): calendar-first news with provenance and permitted automated refresh'
          python - <<'PY'
          import os,base64,subprocess
          assert os.environ['GITHUB_REF']=='refs/heads/feature/schedule-feed'
          env=dict(os.environ);token=env.pop('GH_TOKEN')
          env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+token).encode()).decode()
          remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/feature/schedule-feed'],env=env).decode().split()[0]
          assert remote==os.environ['GITHUB_SHA'],'Feature changed; refusing push'
          subprocess.run(['git','push','origin','HEAD:refs/heads/feature/schedule-feed'],env=env,check=True)
          PY
