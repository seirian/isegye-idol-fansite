name: Playground - authorized one-time main refresh
on:
  push:
    branches: [ops/playground-verification-20261124]
    paths: [.github/workflows/playground-verification-export.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: isegye-playground-rollout-dispatch-127
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/ops/playground-verification-20261124' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require verified deployment and dispatch the fixed main batch exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_PAUSED: ${{ vars.PRODUCTION_PAUSED }}
          ISEGYE_PLAYGROUND_PAUSED: ${{ vars.ISEGYE_PLAYGROUND_PAUSED }}
        run: |
          python - <<'PY_DISPATCH'
          """One explicitly authorized dispatch; no hosting access and no write retries."""
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import subprocess

          REPO = 'seirian/isegye-idol-fansite'
          MAIN = '7be30e5e7681a41078c22b91f949f4acb8c17f6a'
          PRODUCTION_RUN = 45401443433
          WORKFLOW = 'playground-daily.yml'
          ACTIVE = ('queued', 'in_progress', 'waiting', 'pending', 'requested')


          def authorize(api, env):
              if (env.get('GITHUB_REPOSITORY') != REPO
                      or env.get('GITHUB_REF') != 'refs/heads/ops/playground-verification-20261124'
                      or env.get('GITHUB_RUN_ATTEMPT') != '1'):
                  raise ValueError('unexpected_or_repeated_invocation')
              if any(env.get(k) == 'true' for k in ('PRODUCTION_PAUSED', 'ISEGYE_PLAYGROUND_PAUSED')):
                  raise ValueError('publication_paused')
              for attempt in range(2):
                  deploy = api('GET', f'repos/{REPO}/actions/runs/{PRODUCTION_RUN}')
                  if not (deploy.get('repository', {}).get('full_name') == REPO
                          and deploy.get('head_repository', {}).get('full_name') == REPO
                          and deploy.get('head_branch') == 'main'
                          and deploy.get('head_sha') == MAIN
                          and deploy.get('path') == '.github/workflows/production.yml'
                          and deploy.get('event') == 'push'
                          and deploy.get('status') == 'completed'
                          and deploy.get('conclusion') == 'success'):
                      raise ValueError('production_not_verified')
                  head = api('GET', f'repos/{REPO}/git/ref/heads/main')
                  if head.get('object', {}).get('sha') != MAIN:
                      raise ValueError('main_changed')
                  if attempt == 0:
                      for status in ACTIVE:
                          rows = api('GET', f'repos/{REPO}/actions/workflows/{WORKFLOW}/runs?status={status}&per_page=1')
                          if (type(rows.get('total_count')) is not int
                                  or rows['total_count'] != 0 or rows.get('workflow_runs') != []):
                              raise ValueError('existing_or_unconfirmed_active_run')
              return {'ref': 'main'}


          def main():
              result = {'status': 'not_dispatched', 'repository': REPO, 'mainSha': MAIN,
                        'productionRunId': PRODUCTION_RUN, 'workflow': WORKFLOW,
                        'checkedAt': datetime.now(timezone.utc).isoformat(), 'postAttempted': False}
              def api(method, endpoint, payload=None):
                  # Endpoints are literals constructed above, never supplied by page content.
                  args = ['gh', 'api', '--hostname', 'github.com', '--method', method,
                          '-H', 'Accept: application/vnd.github+json',
                          '-H', 'X-GitHub-Api-Version: 2026-03-10', endpoint]
                  if payload is not None:
                      args += ['--input', '-']
                  proc = subprocess.run(args, input=json.dumps(payload) if payload is not None else None,
                                        text=True, capture_output=True, timeout=45, check=True)
                  return json.loads(proc.stdout) if proc.stdout.strip() else {}
              try:
                  payload = authorize(api, os.environ)
                  result['postAttempted'] = True
                  result['status'] = 'dispatch_unknown'
                  Path('playground-dispatch-report.json').write_text(json.dumps(result) + '\n')
                  response = api('POST', f'repos/{REPO}/actions/workflows/{WORKFLOW}/dispatches', payload)
                  run_id = response.get('workflow_run_id')
                  if type(run_id) is int and run_id > 0:
                      result.update(status='dispatch_requested', workflowRunId=run_id)
                  else:
                      result['status'] = 'dispatch_accepted_id_unavailable'
              except Exception as exc:
                  # Do not echo exception/HTTP body or retry a write with ambiguous outcome.
                  result['errorType'] = type(exc).__name__
                  if not result['postAttempted']:
                      result['status'] = 'blocked_before_dispatch'
                  raise
              finally:
                  Path('playground-dispatch-report.json').write_text(json.dumps(result, indent=2) + '\n')
                  print(json.dumps(result))


          if __name__ == '__main__':
              main()
          PY_DISPATCH
      - name: Preserve dispatch receipt without credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playground-rollout-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: playground-dispatch-report.json
          retention-days: 3
