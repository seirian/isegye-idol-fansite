name: Validate, test and preview
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    name: Content, unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate content, release and rollback boundaries
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install isolated build and browser dependencies
        run: |
          python -m venv /tmp/release-tools
          /tmp/release-tools/bin/pip install playwright==1.56.0 pillow==11.3.0
          /tmp/release-tools/bin/python -m playwright install --with-deps chromium
      - name: Refresh public channel snapshots and verify selected music links
        run: |
          /tmp/release-tools/bin/python scripts/refresh_catalog_videos.py
          /tmp/release-tools/bin/python scripts/check_music_video_sources.py
      - name: Build owner-approved LIVE and catalog release
        env:
          PYTHON: /tmp/release-tools/bin/python
        run: |
          npm run build
          node scripts/standalone.mjs
      - name: Test exact preview bundle and disconnected standalone UI
        run: |
          /tmp/release-tools/bin/python scripts/verify_release_v04.py
          /tmp/release-tools/bin/python tests/offline_smoke.py
      - name: Validate main-only production packaging without upload
        env:
          PYTHON: /tmp/release-tools/bin/python
        run: |
          DEPLOY_ENV=production GITHUB_REF=refs/heads/main GITHUB_REF_NAME=main npm run build
          test ! -f dist/review.html
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-review-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 14
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-review-${{ github.sha }}
          path: test-results/
          retention-days: 14
      - name: Preserve published review URLs alongside develop
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && vars.ENABLE_PAGES_PREVIEW == 'true'
        run: |
          mkdir -p /tmp/isegye-pages/second /tmp/isegye-pages/previews/feature-readability /tmp/isegye-pages/previews/feature-live
          cp -a dist/. /tmp/isegye-pages/
          cp -a readability-dist/. /tmp/isegye-pages/second/
          cp -a readability-dist/. /tmp/isegye-pages/previews/feature-readability/
          cp -a dist/. /tmp/isegye-pages/previews/feature-live/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && vars.ENABLE_PAGES_PREVIEW == 'true'
        with:
          path: /tmp/isegye-pages/
  pages-preview:
    name: Develop only - GitHub Pages preview
    needs: test-build
    concurrency:
      group: isegye-pages-publish
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && vars.ENABLE_PAGES_PREVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://seirian.github.io/isegye-idol-fansite/
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install public site verifier
        run: |
          python -m venv /tmp/pages-verifier
          /tmp/pages-verifier/bin/pip install playwright==1.56.0
          /tmp/pages-verifier/bin/python -m playwright install --with-deps chromium
      - name: Verify published develop and retained review URL
        env:
          RELEASE_URL: https://seirian.github.io/isegye-idol-fansite/
          RELEASE_MODE: preview
          RELEASE_OUT: test-results/pages
        run: |
          /tmp/pages-verifier/bin/python scripts/verify_release_v04.py
          RELEASE_URL=https://seirian.github.io/isegye-idol-fansite/previews/feature-live/ RELEASE_OUT=test-results/pages-feature /tmp/pages-verifier/bin/python tests/release_v04_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pages-live-${{ github.sha }}
          path: |
            test-results/pages/
            test-results/pages-feature/
          retention-days: 14
