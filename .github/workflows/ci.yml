name: Validate, test and preview
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    name: Content, unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate content, release and rollback boundaries
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate Google access library and storage
        run: |
          composer install --working-dir=auth --no-dev --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
          composer audit --working-dir=auth --no-dev
          php tests/auth/store_test.php
          php tests/auth/jwt_test.php
      - name: Install isolated build and browser dependencies
        timeout-minutes: 6
        run: |
          python -m venv /tmp/release-tools
          /tmp/release-tools/bin/pip install playwright==1.56.0 pillow==11.3.0 cryptography
          bash scripts/ci_browser_install.sh /tmp/release-tools/bin/python
      - name: Test first-administrator access with local synthetic identities only
        run: /tmp/release-tools/bin/python tests/auth/browser.py
      - name: Refresh public channel snapshots and verify selected music links
        run: |
          /tmp/release-tools/bin/python scripts/refresh_catalog_videos.py
          /tmp/release-tools/bin/python scripts/check_music_video_sources.py
          python scripts/schedule_feed.py --previous schedule/snapshot.json
      - name: Build approved simple-home release
        env:
          PYTHON: /tmp/release-tools/bin/python
        run: |
          npm run build
          node scripts/standalone.mjs
      - name: Test exact preview bundle and disconnected standalone UI
        run: |
          /tmp/release-tools/bin/python scripts/verify_release_v04.py
          /tmp/release-tools/bin/python tests/offline_smoke.py
      - name: Validate main-only production packaging without upload
        env:
          PYTHON: /tmp/release-tools/bin/python
        run: |
          DEPLOY_ENV=production GITHUB_REF=refs/heads/main GITHUB_REF_NAME=main npm run build
          test ! -f dist/review.html
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-review-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 14
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-review-${{ github.sha }}
          path: test-results/
          retention-days: 14
      - name: Replace public preview mirrors with authenticated-origin notice
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && vars.ENABLE_PAGES_PREVIEW == 'true'
        run: python scripts/build_pages_notice.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && vars.ENABLE_PAGES_PREVIEW == 'true'
        with:
          path: /tmp/isegye-pages/
  pages-preview:
    name: Develop only - authenticated origin notice
    needs: test-build
    concurrency:
      group: isegye-pages-publish
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && vars.ENABLE_PAGES_PREVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://seirian.github.io/isegye-idol-fansite/
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify no public application mirror remains
        run: python tests/pages_access_notice.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pages-notice-${{ github.sha }}
          path: test-results/pages-notice/
          retention-days: 14
