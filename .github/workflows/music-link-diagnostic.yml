name: Inspect held music source (read only)
on:
  push:
    branches: [feature/daily-music-catalog]
    paths: [.github/workflows/music-link-diagnostic.yml]
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          PYTHONPATH=scripts python - <<'PY'
          import daily_music as m,daily_music_listing as l,urllib.parse as u,json,re
          from html.parser import HTMLParser
          class P(HTMLParser):
              def handle_starttag(self,t,a):
                  x=dict(a); k=x.get('itemprop') or x.get('property') or x.get('rel'); val=x.get('content') or x.get('href','');
                  if k in ('datePublished','uploadDate','videoId','channelId','og:title','canonical','og:url','author','duration','name') and len(val)<200:self.vals[k]=val
          def vid(v):
              j={};url='https://www.youtube.com/watch?v='+v;oe=json.loads(m.read('https://www.youtube.com/oembed?'+u.urlencode({'url':url,'format':'json'}),128000));j.update(oembedTitle=oe.get('title'),author=oe.get('author_url'))
              for suffix in ('&hl=en',''):
                  try:
                      b=m.read(url+suffix,5500000).decode();p=P();p.vals={};p.feed(b);play=l.embedded(b,'ytInitialPlayerResponse');detail=play.get('videoDetails',{});micro=play.get('microformat',{}).get('playerMicroformatRenderer',{});j[suffix or 'plain']={'html':p.vals,'details':{k:detail.get(k) for k in ('videoId','channelId','title','isLiveContent','isUpcoming')},'micro':{k:micro.get(k) for k in ('publishDate','uploadDate','externalChannelId')},'status':play.get('playabilityStatus',{}).get('status'),'dateTags':list(dict.fromkeys(re.findall(r'"(?:publishDate|uploadDate|datePublished)"\s*:\s*"([\dT:+Z-]+)"',b)))[:5]}
                  except Exception as e:j[suffix or 'plain']={'err':str(e)[:50]}
              return j
          data={v:vid(v) for v in ['tCdsCjYcB5o','zGOzGcEbd-s']};open('public-music-proof.json','w').write(json.dumps(data,ensure_ascii=False));print(data)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: official-metadata-proof, path: public-music-proof.json, retention-days: 3}
