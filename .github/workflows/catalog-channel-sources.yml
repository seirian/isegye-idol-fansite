name: Inspect linked member upload feeds
on:
  push:
    branches: ['feature/live']
    paths: ['.github/workflows/catalog-channel-sources.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read specified public channel metadata and Atom feeds
        run: |
          mkdir -p channel-inspection
          python - <<'PY'
          import concurrent.futures,json,re,time,urllib.request,urllib.parse,xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime,timezone
          groups={
          'ine':['@INE_','@Desuk','@INE_dasibogi'],
          'jingburger':['UCHE7GBQVtdh-c1m3tjFdevQ','UC-S9NE-xzcBpxOFSvsmOzAA','UCrN7Gb8xIZF_0ZYA1cmVNxQ'],
          'lilpa':['@lilpa','@lilpa_sub','@lilpa_vod','@lilpa_archive','@fruitbat700'],
          'jururu':['@JU_RURU','@UnsealedJURURU','@JURURU_dasibogi'],
          'gosegu':['@gosegu','@GOSEGU_Music','@gosegumore','@gosegureplay'],
          'viichan':['UCs6EwgxKLY9GG4QNUrP5hoQ','UCuJUfqThFp5-k-lrHcO1dFg','UCk2vPN7LATiMz_r8VUiA0KQ']}
          out=Path('channel-inspection');now=datetime.now(timezone.utc).isoformat()
          def get(url):
              assert urllib.parse.urlparse(url).hostname=='www.youtube.com'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ko-KR,ko;q=0.9'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  assert urllib.parse.urlparse(r.url).hostname=='www.youtube.com'
                  b=r.read(4*1024*1024+1);assert len(b)<=4*1024*1024
                  return b
          def task(item):
              member,j,loc=item;result={'key':member+'-'+str(j),'member':member,'locator':loc,'checkedAt':now}
              try:
                  cid=loc
                  if loc.startswith('@'):
                      html=get('https://www.youtube.com/'+loc).decode('utf-8')
                      ids=re.findall(r'"channelMetadataRenderer"\s*:\s*\{[^}]*?"externalId"\s*:\s*"(UC[A-Za-z0-9_-]{22})"',html)
                      if not ids:ids=re.findall(r'<link[^>]+rel="canonical"[^>]+href="https://www.youtube.com/channel/(UC[A-Za-z0-9_-]{22})"',html)
                      assert len(set(ids))==1,'Unresolved or ambiguous channel ID'
                      cid=ids[0]
                  assert re.fullmatch(r'UC[A-Za-z0-9_-]{22}',cid)
                  result['channelId']=cid;result['url']='https://www.youtube.com/channel/'+cid
                  feed='https://www.youtube.com/feeds/videos.xml?channel_id='+cid
                  raw=get(feed);assert b'<!DOCTYPE' not in raw.upper()
                  (out/(result['key']+'.xml')).write_bytes(raw)
                  tree=ET.fromstring(raw);ns={'a':'http://www.w3.org/2005/Atom','yt':'http://www.youtube.com/xml/schemas/2015','m':'http://search.yahoo.com/mrss/'}
                  result['title']=tree.findtext('a:title',namespaces=ns);result['feedUrl']=feed
                  videos=[]
                  for e in tree.findall('a:entry',ns):
                      vid=e.findtext('yt:videoId',namespaces=ns);published=e.findtext('a:published',namespaces=ns)
                      if not re.fullmatch(r'[A-Za-z0-9_-]{11}',vid or ''):continue
                      if datetime.fromisoformat(published.replace('Z','+00:00'))>datetime.now(timezone.utc):continue
                      videos.append({'id':vid,'title':e.findtext('a:title',namespaces=ns),'publishedAt':published,'url':'https://www.youtube.com/watch?v='+vid,'thumbnail':'https://i.ytimg.com/vi/'+vid+'/mqdefault.jpg'})
                  result['videos']=sorted(videos,key=lambda v:v['publishedAt'],reverse=True)[:3]
                  result['status']='ok'
              except Exception as e:result.update(status='error',error=str(e)[:200],videos=[])
              return result
          tasks=[(m,j,l) for m,ls in groups.items() for j,l in enumerate(ls)]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(task,tasks))
          (out/'channels.json').write_text(json.dumps({'checkedAt':now,'channels':results},ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: member-channel-feeds-${{ github.run_id }}
          path: channel-inspection/
          retention-days: 14
