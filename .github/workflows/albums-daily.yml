name: Albums - daily verified metadata and chart refresh
on:
  schedule:
    - cron: '13 22 * * *' # next calendar day, 07:13 Asia/Seoul
  workflow_dispatch:
  workflow_run:
    workflows: ['Music - daily verified catalog refresh']
    types: [completed]
    branches: [main]
permissions: {contents: read}
concurrency:
  group: isegye-inour-production
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: main, persist-credentials: false}
      - name: Respect global and album pause controls
        env:
          PRODUCTION_PAUSED: ${{ vars.PRODUCTION_PAUSED }}
          ISEGYE_ALBUMS_PAUSED: ${{ vars.ISEGYE_ALBUMS_PAUSED }}
        run: test "$PRODUCTION_PAUSED" != true && test "$ISEGYE_ALBUMS_PAUSED" != true
      - name: Install isolated pinned public readers and SFTP transport
        run: |
          python -m venv /tmp/albums-daily
          /tmp/albums-daily/bin/pip install beautifulsoup4==4.14.3 pillow==11.3.0 paramiko==5.0.0
      - name: Test catalog identities, preservation and publication boundaries
        run: |
          /tmp/albums-daily/bin/python -m unittest discover -s tests -p 'test_albums_daily*.py' -v
          node --test tests/albums-runtime.test.js
      - name: Restore last verified observations and images without public requests
        run: /tmp/albums-daily/bin/python scripts/album_runtime.py restore
        env:
          PRODUCTION_PAUSED: ${{ vars.PRODUCTION_PAUSED }}
          ISEGYE_ALBUMS_PAUSED: ${{ vars.ISEGYE_ALBUMS_PAUSED }}
          ISEGYE_SFTP_PASSWORD: ${{ secrets.ISEGYE_SFTP_PASSWORD }}
      - name: Collect registered albums and current Melon chart observations
        run: |
          /tmp/albums-daily/bin/python scripts/check_album_release_videos.py
          /tmp/albums-daily/bin/python scripts/daily_albums.py
        env:
          ISEGYE_YOUTUBE_API_KEY: ${{ secrets.ISEGYE_YOUTUBE_API_KEY }}
      - name: Require complete mandatory sources before changing the live feed
        run: /tmp/albums-daily/bin/python scripts/daily_albums.py --check
      - name: Atomically publish album-only data and verify every uploaded image
        run: /tmp/albums-daily/bin/python scripts/album_runtime.py publish
        env:
          PRODUCTION_PAUSED: ${{ vars.PRODUCTION_PAUSED }}
          ISEGYE_ALBUMS_PAUSED: ${{ vars.ISEGYE_ALBUMS_PAUSED }}
          ISEGYE_SFTP_PASSWORD: ${{ secrets.ISEGYE_SFTP_PASSWORD }}
      - name: Record actual health and publication result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          def read(name):
              p=Path(name)
              return json.loads(p.read_text()) if p.exists() else {}
          p=read('albums-publication.json');h=read('albums-health.json')
          text=f"Albums: {p.get('status','not published')}; tracks {p.get('totalTracks','—')}; required health {h.get('state','not checked')}; readback {p.get('verifiedReadback',False)}."
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write(text+'\n')
          for warning in h.get('optionalWarnings',[]):print('::warning::Optional album source: '+warning)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: daily-albums-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            albums-restore.json
            albums-health.json
            albums-publication.json
            albums/snapshot.json
            albums/asset-cache/
            test-results/albums-domestic/
            test-results/albums-records/
            test-results/music-sources/
          retention-days: 30
