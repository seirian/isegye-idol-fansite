name: Request reviewed album history deployment
on:
  push:
    branches: ['fix/all-albums-melon-backfill-20261116']
    paths: ['.github/workflows/album-history-dispatch.yml']
permissions: {contents: read, actions: write}
jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Dispatch existing validation and deployment only for the exact reviewed main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          import os,json
          base='https://api.github.com/repos/seirian/isegye-idol-fansite'
          expected='20aede7ca2b821d155f528e6a9853e1903b28975'
          token=os.environ.pop('GH_TOKEN')
          def call(path,body=None):
            req=Request(base+path,data=json.dumps(body).encode() if body is not None else None,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'IsegyeReviewedHistoryDispatch/1.0'})
            with urlopen(req,timeout=30) as r:
              raw=r.read();return json.loads(raw) if raw else {'status':r.status}
          if call('/git/ref/heads/main')['object']['sha']!=expected:raise ValueError('Main changed; request refused')
          runs=call('/actions/runs?head_sha='+expected+'&per_page=100')['workflow_runs']
          for workflow in ('ci.yml','production.yml'):
            existing=[r for r in runs if r['path']=='.github/workflows/'+workflow and r['head_branch']=='main']
            if existing:print(json.dumps({'workflow':workflow,'status':'already_requested','runs':[r['id'] for r in existing]}));continue
            result=call('/actions/workflows/'+workflow+'/dispatches',{'ref':'main'})
            print(json.dumps({'workflow':workflow,'status':'requested_not_published','response':result}))
          token=None
          PY
