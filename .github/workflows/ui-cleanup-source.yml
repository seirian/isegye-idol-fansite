name: UI cleanup - source inspection
on:
  push:
    branches: [feature/remove-redundant-ui]
    paths: [.github/workflows/ui-cleanup-source.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: git archive --format=tar.gz -o /tmp/ui-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-source
          path: /tmp/ui-source.tar.gz
          retention-days: 2
