name: Guyso production adapter source check
on:
  push:
    branches: ['fix/guyso-peak-records-20261118']
    paths: ['.github/workflows/guyso-runtime-source-check.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 37fcb9490e40a337a473881d0dc24e7401956d59
          persist-credentials: false
      - run: python -m pip install beautifulsoup4==4.14.3
      - name: Use unchanged production fetch headers and parser on three exact song pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import sys,json,time
          sys.path.insert(0,'scripts')
          import collect_album_peak_fallback as c
          from collect_album_records import fetch
          data=c.reviewed_records();rows=[]
          for sid in ('love-cells','rewind','cat-save-world'):
            e=data[sid];m=e['identity'];url=c.source_url(m['trackId'])
            raw=fetch(url)
            result=c.parse_reference(raw,m,m['trackId'],datetime.now(timezone.utc).isoformat())
            rows.append({'songId':sid,'source':url,'verified':c.reusable(result,m),'checkedAt':result['checkedAt'],'responseSha256':result['responseSha256'],'records':result['records'],'ranksEqualReviewedData':result['records']==e['reference']['records']})
            time.sleep(1)
          report={'commit':'37fcb9490e40a337a473881d0dc24e7401956d59','productionWrites':False,'actualRuntimeFetchAndParser':True,'tracks':rows}
          Path('guyso-runtime-source-check.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          assert all(r['verified'] for r in rows)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guyso-runtime-source-check-${{ github.run_id }}
          path: guyso-runtime-source-check.json
          retention-days: 14
