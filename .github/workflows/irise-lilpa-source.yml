name: Verify selected IRISE LILPA collaboration source
on:
  push:
    branches: ['content/irise-lilpa-collab']
    paths: ['.github/workflows/irise-lilpa-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/content/irise-lilpa-collab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify only the requested public collaboration video
        env:
          ISEGYE_YOUTUBE_API_KEY: ${{ secrets.ISEGYE_YOUTUBE_API_KEY }}
        run: |
          mkdir -p selected-video-evidence
          python - <<'PY'
          import json, os, re, urllib.request, urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path
          key = os.environ.get('ISEGYE_YOUTUBE_API_KEY', '').strip()
          if not key:
              raise SystemExit('Configured YouTube API key unavailable to verification job')
          query = urllib.parse.urlencode({'part': 'snippet,contentDetails,status,liveStreamingDetails', 'id': 'P15VglxEkss', 'key': key})
          try:
              with urllib.request.urlopen('https://www.googleapis.com/youtube/v3/videos?' + query, timeout=30) as response:
                  data = json.load(response)
          except Exception:
              raise SystemExit('YouTube metadata request failed; credentials and request URL are not logged') from None
          rows = data.get('items', [])
          if len(rows) != 1 or rows[0].get('id') != 'P15VglxEkss':
              raise SystemExit('Requested video was not uniquely returned')
          item = rows[0]; snippet = item['snippet']; status = item['status']; details = item['contentDetails']
          if status.get('privacyStatus') != 'public':
              raise SystemExit('Requested video is not public')
          match = re.fullmatch(r'PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?', details['duration'])
          if not match:
              raise SystemExit('Unsupported duration format')
          seconds = sum(int(value or 0) * scale for value, scale in zip(match.groups(), [3600, 60, 1]))
          evidence = {'source': 'YouTube Data API v3 videos.list', 'evidenceRun': int(os.environ['GITHUB_RUN_ID']), 'checkedAt': datetime.now(timezone.utc).isoformat(), 'id': item['id'], 'title': snippet['title'], 'channelId': snippet['channelId'], 'channelTitle': snippet['channelTitle'], 'publishedAt': snippet['publishedAt'], 'description': snippet.get('description', ''), 'durationSeconds': seconds, 'privacyStatus': status['privacyStatus'], 'embeddable': status.get('embeddable'), 'definition': details.get('definition'), 'regionRestriction': details.get('regionRestriction', {}), 'liveBroadcastContent': snippet.get('liveBroadcastContent'), 'liveStreamingDetails': item.get('liveStreamingDetails', {})}
          text = json.dumps(evidence, ensure_ascii=False, indent=2)
          Path('selected-video-evidence/irise-lilpa.json').write_text(text + '\n', encoding='utf-8')
          print(text)
          PY
      - name: Preserve exact source for regression tests
        if: always()
        run: git archive HEAD -o selected-video-evidence/source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: selected-irise-lilpa-${{ github.run_id }}
          path: selected-video-evidence/
          retention-days: 14
