name: History - verify monthly implementation (work branch only)
on:
  push:
    branches: [feature/monthly-history-refresh]
    paths: [.github/workflows/history-verify-once.yml]
permissions: {contents: write}
jobs:
  verify:
    if: github.ref == 'refs/heads/feature/monthly-history-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply exact previously network-and-browser-tested implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib,subprocess
          parts=[Path(f'scripts/_history_patch_{i}.txt').read_text().strip() for i in range(4)]
          parts[1]=parts[1].replace('NwdAZOXiscwe99d6H3+eL373x71vnq7','NwdAZOXiscwe99d6H3+48u7l+8twrV86vX54+N31yZnod1+Grm7sbz3CBH+BK98FFmo+hvc9+3L21tQ7D7n3+eL373x71vnq7').replace('FANh7CmNfRZZ+XPP8Lzznd3v+NfVSMx3SDEX4EMA9FIQ','FANh7CmNfRZ+XPP8LzzndbvY1vVSMx3SDEX4EMA9FIQ')
          raw=zlib.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='63d99b096403af8d1c0da23c521131e9daad666c53741247ee477c09265ae3aa'
          assert hashlib.sha256(Path('.github/workflows/history-monthly.yml').read_bytes()).hexdigest()=='e46bb593611c3ee9bc942431862c0b1ff2483df1120a8162971681ecba47b0f5'
          subprocess.run(['git','apply','--check','--exclude=.github/workflows/history-monthly.yml','-'],input=raw,check=True)
          subprocess.run(['git','apply','--exclude=.github/workflows/history-monthly.yml','-'],input=raw,check=True)
          PY
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit application files only on work branch
        run: |
          git rm scripts/_history_patch_*.txt
          git add auth/Gateway.php docs/BATCHES.md scripts/monthly_history.py scripts/publish_monthly_history.py scripts/enhance_visual_history.py scripts/verify_release_v04.py tests/auth/browser.py tests/test_monthly_history.py tests/monthly-history.test.js tests/monthly_history_browser.py visuals/core.js visuals/monthly-history.js visuals/theme.css visuals/ui.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(history): verified monthly activity feed; retain curated history and source dates'
          git push origin HEAD:feature/monthly-history-refresh
