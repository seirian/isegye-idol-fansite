name: Berriz public-source inspection
on:
  push:
    branches: [feature/berriz-official]
    paths: [.github/workflows/berriz-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare isolated public browser
        run: |
          python -m venv /tmp/berriz-inspect
          /tmp/berriz-inspect/bin/pip install playwright==1.56.0
          /tmp/berriz-inspect/bin/playwright install --with-deps chromium
      - name: Public metadata only, no login or credentials
        run: |
          mkdir -p inspection
          /tmp/berriz-inspect/bin/python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from urllib.robotparser import RobotFileParser
          import json,re
          out=Path('inspection'); result={'robots':{},'api':[],'calendar':[]}
          for host in ['berriz.in','svc-api.berriz.in']:
              try:
                  with urlopen('https://'+host+'/robots.txt',timeout=20) as r: result['robots'][host]={'status':r.status,'text':r.read(50000).decode()}
              except HTTPError as e:result['robots'][host]={'status':e.code}
          def cleaned(v):
              if isinstance(v,list):return [cleaned(x) for x in v]
              if isinstance(v,dict):return {k:cleaned(x) for k,x in v.items() if not re.search(r'body|content|description|comment|profile|email|token|cookie|memberKey|userId',k,re.I)}
              return v
          for path in ['/service/v1/community/id/isegyeidol?languageCode=ko','/service/v1/community/40/notices?pageSize=20&languageCode=ko','/service/v1/calendar/schedule?communityId=40&year=2026&month=10&timeZone=Asia%2FSeoul&languageCode=ko','/service/v1/calendar/schedule?communityId=40&year=2026&month=11&timeZone=Asia%2FSeoul&languageCode=ko']:
              u='https://svc-api.berriz.in'+path
              rule=result['robots']['svc-api.berriz.in'];allowed=rule['status']==404
              if rule['status']==200:
                  rp=RobotFileParser();rp.parse(rule['text'].splitlines());allowed=rp.can_fetch('IsegyeSchedule',u)
              if not allowed:result['api'].append({'url':u,'blockedByRobots':True});continue
              try:
                  with urlopen(Request(u,headers={'User-Agent':'IsegyeSchedule/1.0 (+https://isegye-idol.kr/auth/terms)','Accept':'application/json'}),timeout=20) as r:
                      result['api'].append({'url':u,'status':r.status,'data':cleaned(json.loads(r.read(2000000)))})
              except HTTPError as e:result['api'].append({'url':u,'status':e.code})
          with sync_playwright() as p:
              b=p.chromium.launch();c=b.new_context(locale='ko-KR',timezone_id='Asia/Seoul',viewport={'width':1440,'height':1000});page=c.new_page()
              def capture(r):
                  if r.url.startswith('https://svc-api.berriz.in/service/v1/calendar/') and r.status==200:
                      try:result['calendar'].append({'url':r.url,'data':cleaned(r.json())})
                      except Exception:pass
              page.on('response',capture)
              page.goto('https://berriz.in/ko/isegyeidol/calendar/',wait_until='domcontentloaded',timeout=45000);page.wait_for_timeout(5000)
              event=page.get_by_text('HAPPY JINGBURGER DAY',exact=True)
              if event.count():
                  event.first.click();page.wait_for_timeout(3000)
                  result['detail']={'url':page.url,'text':page.locator('body').inner_text(),'links':page.locator('a[href]').evaluate_all('(xs)=>xs.map(x=>({text:x.innerText,url:x.href})).filter(x=>x.url.includes("isegyeidol"))')}
                  page.screenshot(path=str(out/'calendar-detail.png'),full_page=True)
              page.goto('https://berriz.in/ko/isegyeidol/calendar/',wait_until='domcontentloaded');page.wait_for_timeout(3000)
              page.get_by_role('button',name='다음 달',exact=True).click();page.wait_for_timeout(3000)
              result['november']={'url':page.url,'text':page.locator('body').inner_text()}
              page.screenshot(path=str(out/'calendar-november.png'),full_page=True);b.close()
          (out/'metadata.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps({'requests':len(result['api']),'credentialsUsed':False}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: berriz-public-metadata
          path: inspection/
          retention-days: 3
