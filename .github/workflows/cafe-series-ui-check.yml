name: Cafe - public series search verification
on:
  push:
    branches: ['feature/cafe-batch-20261031']
    paths: ['.github/workflows/cafe-series-ui-check.yml']
permissions: {contents: read}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          python -m venv /tmp/br
          /tmp/br/bin/pip -q install playwright==1.56.0
          bash scripts/ci_browser_install.sh /tmp/br/bin/python > /tmp/br.log
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/review_fan_series.py');s=p.read_text(); line=next(l for l in s.splitlines() if 'page.goto(legacy,' in l);p.write_text(s.replace(line,'        from fan_search_public_ui import search\n        page=search(page)'))
          PY
          /tmp/br/bin/python scripts/review_fan_series.py 2026-10-31
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: checked-fan-series, path: fan-review.json, retention-days: 14}
