name: Verify official music formats (work branch)
on:
  push:
    branches: ['feature/official-music-formats']
    paths: ['.github/workflows/official-formats-test.yml']
permissions: {contents: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 'feature/official-music-formats'}
      - name: Apply narrow changes and run data/renderer tests
        run: |
          python .official-formats-integration.py
          git restore -- .github/workflows/music-daily.yml
          python -m unittest discover -s tests -p 'test_daily_music*.py' -v
          node --test tests/daily-music.test.js
          python -m venv /tmp/official
          /tmp/official/bin/pip -q install pillow==11.3.0
      - name: Require verified target, classify live public channel tiles, and exercise real UI loading path with both formats
        run: |
          /tmp/official/bin/python scripts/daily_music.py
          PYTHONPATH=scripts /tmp/official/bin/python - <<'PY'
          import daily_music as m,daily_music_listing as l,json
          from pathlib import Path
          doc=json.loads(Path('music-discovery.json').read_text());v='lFgCjRoFjyU';rows=[r for r in doc['rows'] if r['videoId']==v];assert len(rows)==1 and rows[0]['type']=='album_medley' and rows[0]['publishedAt'].startswith('2026-11-02T09:00:14') and rows[0]['channelKey']=='c2',doc['sources']['c2'];cid=m.CHANNELS['c2'][0]
          page=l.embedded(m.read('https://www.youtube.com/channel/'+cid+'/videos?hl=en',5000000).decode(),'ytInitialData');assert page['metadata']['channelMetadataRenderer']['externalId']==cid
          active=[n['tabRenderer'] for n in l.tree(page['contents']) if n.get('tabRenderer',{}).get('selected') and n['tabRenderer']['endpoint']['commandMetadata']['webCommandMetadata']['url'].rstrip('/').endswith('/videos')];assert len(active)==1
          tiles={}
          for n in l.tree(active[0].get('content',{})):
              mv=n.get('lockupViewModel',{});ov=n.get('videoRenderer',{});i=mv.get('contentId') or ov.get('videoId');t=mv.get('metadata',{}).get('lockupMetadataViewModel',{}).get('title',{}).get('content') or l.text(ov.get('title',{}));
              if m.VID.fullmatch(i or '') and t:tiles[i]=t
          known=m.channel_evidence('c2',tiles.values(),m.baseline()[1]);matches={i:m.classify('c2',t,known) for i,t in tiles.items()};matches={i:r for i,r in matches.items() if r};assert matches[v]['type']=='album_medley' and matches['8IY44RZHyw8']['type']=='music_clip' and matches['tGMwZ0O2-Oc']['kind']=='official_audio' and matches['zFmKBpHrKY8']['kind']=='official_mv'
          for i in ['0dYURNkDjjw','U-kPLcJhdp0','YxE-c8B5mxE','3ZqApuO34ok','JDCTwRw0vYk','a4kU1eEWhIY']:assert i in tiles and i not in matches,i
          Path('format-report.json').write_text(json.dumps({'target':rows[0],'sampleSize':len(tiles),'sampleMatches':matches,'sampleExcluded':len(tiles)-len(matches),'freshVerified':len(doc['rows']),'sourceState':doc['sources']['c2'],'checkedAt':doc['generatedAt']},ensure_ascii=False,indent=2));print('verified medley; sample:',len(tiles),len(matches))
          PY
      - name: Commit only tested source files on this work branch
        run: |
          git add scripts/daily_music.py scripts/daily_music_listing.py scripts/publish_daily_music.py scripts/enhance_catalog.py catalog/core.js catalog/daily-music.js catalog/video-ui.js tests/daily-music.test.js docs/BATCHES.md
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply and verify official-channel formats throughout discovery, deduplication and display'
          git push origin HEAD:feature/official-music-formats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: official-music-result, path: 'format-report.json', if-no-files-found: warn, retention-days: 14}
