name: Fanmade - isolated menu review
on:
  push:
    branches: ['feature/fanmade']
    paths: ['fanmade/**', 'scripts/*fanmade*.py', 'tests/*fanmade*', 'docs/FANMADE_REVIEW.md', '.github/workflows/fanmade-preview.yml']
permissions:
  contents: read
concurrency:
  group: isegye-inour-production
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/feature/fanmade'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://isegye-idol.kr/review-fanmade/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Respect existing deployment pause
        env: {PRODUCTION_PAUSED: '${{ vars.PRODUCTION_PAUSED }}'}
        run: test "$PRODUCTION_PAUSED" != true
      - name: Build and validate isolated Fanmade menu
        run: |
          npm test
          python scripts/build_fanmade.py
          python -m unittest discover -s tests -p test_fanmade.py -v
      - name: Build unchanged identity runtime with one preview route
        run: |
          composer install --working-dir=auth --no-dev --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
          composer audit --working-dir=auth --no-dev
          php tests/auth/store_test.php
          php tests/auth/jwt_test.php
          python scripts/build_fanmade_host.py
          php -l auth-bundle/Gateway.php
          php -l auth-bundle/FanmadePreview.php
      - name: Install isolated test and transfer tools
        run: |
          python -m venv /tmp/fanmade-tools
          /tmp/fanmade-tools/bin/pip install playwright==1.56.0 cryptography==46.0.3 paramiko==5.0.0
          bash scripts/ci_browser_install.sh /tmp/fanmade-tools/bin/python
      - name: Test exact UI over HTTP and existing authorization over TLS
        run: |
          /tmp/fanmade-tools/bin/python tests/fanmade_browser.py
          /tmp/fanmade-tools/bin/python tests/fanmade_host_browser.py
      - name: Publish only the preview and verify unchanged operating site
        run: /tmp/fanmade-tools/bin/python scripts/deploy_fanmade.py
        env:
          REVIEW_COMMIT: ${{ github.sha }}
          REVIEW_DEPLOY_ENABLED: 'true'
          PRODUCTION_PAUSED: ${{ vars.PRODUCTION_PAUSED }}
          ISEGYE_SFTP_PASSWORD: ${{ secrets.ISEGYE_SFTP_PASSWORD }}
      - name: Preserve exact reviewed source
        if: always()
        run: git archive --format=zip --output=fanmade-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fanmade-review-${{ github.sha }}
          path: |
            review-fanmade-deployment.json
            fanmade-source.zip
            fanmade-dist/
            test-results/fanmade/
            test-results/fanmade-host/
          retention-days: 30
