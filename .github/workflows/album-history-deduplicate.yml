name: Remove unstarted duplicate history deployment
on:
  push:
    branches: ['fix/all-albums-melon-backfill-20261116']
    paths: ['.github/workflows/album-history-deduplicate.yml']
permissions: {contents: read, actions: write}
jobs:
  deduplicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Keep the existing normal deployment; cancel only its unstarted exact duplicate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          import os,json
          base='https://api.github.com/repos/seirian/isegye-idol-fansite';expected='20aede7ca2b821d155f528e6a9853e1903b28975';token=os.environ.pop('GH_TOKEN')
          def call(path,post=False):
            req=Request(base+path,data=b'{}' if post else None,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'IsegyeExactDeploymentDedupe/1.0'})
            with urlopen(req,timeout=30) as r:
              raw=r.read();return json.loads(raw) if raw else {'status':r.status}
          keep=call('/actions/runs/43793607537');duplicate=call('/actions/runs/43793678616')
          for run in (keep,duplicate):
            if run['head_sha']!=expected or run['head_branch']!='main' or run['path']!='.github/workflows/production.yml':raise ValueError('Wrong deployment; refusing')
          if not(keep['status']=='in_progress' or keep.get('conclusion')=='success'):raise ValueError('Primary deployment not active/successful')
          if duplicate['status'] in ('pending','queued','waiting','requested'):
            jobs=call('/actions/runs/43793678616/jobs')['jobs']
            if any(j.get('status')=='in_progress' for j in jobs):raise ValueError('Duplicate started; refuse cancellation')
            print(json.dumps({'cancelledUnstartedDuplicate':43793678616,'preservedDeployment':43793607537,'response':call('/actions/runs/43793678616/cancel',True)}))
          else:print(json.dumps({'notCancelled':43793678616,'status':duplicate['status']}))
          token=None
          PY
