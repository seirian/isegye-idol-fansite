name: Inspect public fan-game references
on:
  push:
    branches: [feature/isegye-fangames]
    paths: [.github/workflows/inspect-fangames.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Inspect screenshots, text and interactive states
        run: |
          mkdir -p fan-references
          node <<'JS'
          const {chromium} = require('playwright');
          const fs=require('fs');
          const sites=[
            ['sam','https://3chogomem.pages.dev/'],
            ['chess','https://sedol-chess.pages.dev/'],
            ['survivors','https://waktasurvivors.pluckyiris34.chatgpt.site/']
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const [id,url] of sites){
              const page=await browser.newPage({viewport:{width:1366,height:850},deviceScaleFactor:1});
              const record={url,errors:[],stages:[]};
              page.on('console',m=>{if(m.type()==='error')record.errors.push(m.text().slice(0,220))});
              async function save(stage){
                try{
                  await page.screenshot({path:'fan-references/'+id+'-'+stage+'.png',fullPage:false,timeout:10000});
                  const x=await page.evaluate(()=>({
                    title:document.title,body:document.body?.innerText?.slice(0,5000),
                    elements:[...document.querySelectorAll('button,[role=button],a,input,select')].slice(0,80).map(e=>({tag:e.tagName,text:(e.innerText||e.getAttribute('aria-label')||e.value||'').slice(0,85),id:e.id,href:e.getAttribute('href')})),
                    canvasCount:document.querySelectorAll('canvas').length,
                    imgCount:document.querySelectorAll('img').length,
                    viewport:{scrollHeight:document.body?.scrollHeight}
                  }));
                  record.stages.push({stage,...x});
                }catch(e){record.errors.push(stage+':'+e.message.slice(0,180))}
              }
              try{
                let nav=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
                record.status=nav?.status();
                await page.waitForTimeout(4500);
                await save('landing');
                const candidates=page.getByRole('button',{name:/시작|플레이|게임 시작|START|PLAY|초급|일반|새 게임|혼자/i});
                if(await candidates.count()){
                   const b=candidates.first();
                   await b.click({timeout:4000}).catch(e=>record.errors.push('click:'+e.message.slice(0,130)));
                   await page.waitForTimeout(2500);await save('started');
                }
                await page.keyboard.press('ArrowRight');await page.keyboard.press('Space');await page.waitForTimeout(600);await save('played');
              }catch(e){record.errors.push('navigate:'+e.message.slice(0,300))}
              fs.writeFileSync('fan-references/'+id+'.json',JSON.stringify(record,null,2));
              console.log(id,record.status,record.stages.map(s=>s.stage+': '+(s.body||'').slice(0,200)),record.errors);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fan-game-reference-observations
          path: fan-references/
          retention-days: 7
