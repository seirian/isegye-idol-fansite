name: Waktaverse - implement and verify music-only backfill
on:
  push:
    branches: [feature/waktaverse-music-backfill]
    paths: [.github/workflows/waktaverse-implement.yml]
permissions: {contents: write, actions: read}
jobs:
  verify:
    if: github.ref == 'refs/heads/feature/waktaverse-music-backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          name: waktaverse-audit
          run-id: 41620873000
          github-token: ${{ github.token }}
          path: /tmp/waktaverse-audit
      - name: Apply scoped changes and validate offline
        run: |
          mkdir -p tests/fixtures
          python scripts/_apply_waktaverse_once.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_daily_music_formats.py');s=p.read_text();assert "set(m.CHANNELS)-{'c2'}" in s
          s=s.replace("set(m.CHANNELS)-{'c2'}","set(m.CHANNELS)-{'c1','c2'}")
          s=s.replace('    def test_new_clip_needs_song_evidence(self):',"        self.assertEqual(m.classify('c1',MEDLEY,known)['type'],'album_medley')\n        self.assertEqual(m.classify('c1',CLIP,known)['type'],'music_clip')\n    def test_new_clip_needs_song_evidence(self):")
          p.write_text(s)
          p=Path('scripts/music_public_metadata.py');s=p.read_text();old="    if not canonical.urls or not all(matching(u) for u in canonical.urls):raise ValueError('canonical video mismatch')\n    j=embedded(body,'ytInitialData')"
          new="    j=embedded(body,'ytInitialData')\n    canonical_urls=[u for u in canonical.urls if u not in ('','undefined')]\n    current=j.get('currentVideoEndpoint',{}).get('watchEndpoint',{}).get('videoId')\n    if canonical_urls:\n        if not all(matching(u) for u in canonical_urls) or (current and current!=vid):raise ValueError('canonical video mismatch')\n    elif current!=vid:raise ValueError('current public video identity missing')"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=Path('tests/test_daily_music_waktaverse.py');s=p.read_text();anchor=' def test_failed_history(self):';extra=" def test_current_endpoint_fallback_still_requires_exact_id(self):\n  j=self.fixture();j['currentVideoEndpoint']={'watchEndpoint':{'videoId':'12345678901'}};body=self.html(j).replace('https://www.youtube.com/watch?v=12345678901','undefined');self.assertEqual(public.public_watch_date(body,m.CHANNELS['c1'][0],'12345678901','정확한 곡'),'2023-07-19')\n  with self.assertRaises(ValueError):public.public_watch_date(body,m.CHANNELS['c1'][0],'98765432109','정확한 곡')\n  del j['currentVideoEndpoint']\n  with self.assertRaises(ValueError):public.public_watch_date(self.html(j).replace('https://www.youtube.com/watch?v=12345678901','undefined'),m.CHANNELS['c1'][0],'12345678901','정확한 곡')\n";assert anchor in s;p.write_text(s.replace(anchor,extra+anchor))
          p=Path('docs/BATCHES.md');s=p.read_text().replace('canonical 영상 ID, 본문 제목','canonical URL 또는 현재 영상 메타데이터의 영상 ID, 본문 제목');p.write_text(s)
          PY
          npm test > /tmp/node-tests.txt
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify original public source metadata without production credentials
        run: |
          python -m venv /tmp/wakta-verify
          /tmp/wakta-verify/bin/pip -q install pillow==11.3.0
          PYTHONPATH=scripts /tmp/wakta-verify/bin/python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          import daily_music as m,waktaverse_history as h,music_public_metadata as p
          diagnostics=[];orig=h.public_watch_date
          def observed(body,cid,vid,title):
              try:return orig(body,cid,vid,title)
              except ValueError as e:
                  c=p.Canonical();c.feed(body);j=p.embedded(body,'ytInitialData');diagnostics.append({'videoId':vid,'reason':str(e),'canonical':c.urls,'currentVideoEndpoint':j.get('currentVideoEndpoint')});raise
          h.public_watch_date=observed
          rows,coverage=h.collect(datetime.now(timezone.utc))
          Path('waktaverse-verification.json').write_text(json.dumps({'coverage':coverage,'rows':rows,'diagnostics':diagnostics},ensure_ascii=False,indent=2))
          print(json.dumps({'coverage':coverage,'diagnostics':diagnostics[:2]},ensure_ascii=False))
          assert len(rows)==15 and coverage['verified']==15,coverage
          assert len(m.merge([],rows))==15 and len(m.merge(rows,rows))==15
          assert 'fgSXAKsq-Vo' in m.baseline()[0]
          PY
      - name: Keep implementation only and commit on work branch
        run: |
          rm .github/workflows/waktaverse-inspect.yml .github/workflows/waktaverse-audit.yml .github/workflows/waktaverse-implement.yml scripts/_apply_waktaverse_once.py
          git add catalog scripts tests docs/BATCHES.md .github/workflows/waktaverse-inspect.yml .github/workflows/waktaverse-audit.yml .github/workflows/waktaverse-implement.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(music): verify Waktaverse historical music and restore Rewind discovery'
          git push origin HEAD:feature/waktaverse-music-backfill
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: waktaverse-implementation-proof
          path: waktaverse-verification.json
          retention-days: 14
