name: Verify localized source fallback (work branch)
on:
  push:
    branches: [feature/daily-music-catalog]
    paths: [.github/workflows/music-locale-verification.yml]
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          python - <<'PY'
          from pathlib import Path
          def change(f,a,b):
              p=Path(f);s=p.read_text();assert s.count(a)==1,a;p.write_text(s.replace(a,b))
          f='scripts/daily_music_listing.py'
          change(f,"n['tabRenderer'].get('title','').casefold()=='videos'", "n['tabRenderer'].get('endpoint',{}).get('commandMetadata',{}).get('webCommandMetadata',{}).get('url','').rstrip('/').endswith('/videos')")
          change(f,"and 'ago' in x['content']", "and ('ago' in x['content'] or x['content'].endswith('전'))")
          change(f,"a year) ago',age", "a year) ago|(?:[2-9]|\\d{2,})개월 전|\\d+년 전',age")
          f='scripts/daily_music.py';change(f,"if by: name=MARK.sub(' ',title[:by.start()]).strip(' |:-[]()');credits=by[1]", "if by:\n            name=MARK.sub(' ',title[:by.start()]).strip(' |:-[]()');credits=by[1]\n            if not performers(credits) and not GROUP.search(credits):return None")
          PY
          python -m pip -q install pillow==11.3.0
          python -m unittest discover -s tests -p test_daily_music.py -v && node --test tests/daily-music.test.js
          python scripts/daily_music.py
          python - <<'PY'
          import json
          d=json.load(open('music-discovery.json'));assert sum(s['state']!='error' for s in d['sources'].values())>=8, 'incomplete discovery coverage on production candidate'
          PY
          git rm .github/workflows/music-{shape,locale}-verification.yml
          git add scripts/daily_music.py scripts/daily_music_listing.py;git config user.name github-actions[bot];git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git commit -m 'Verify official Videos tab by its route across locales and reject unspecified external cover credits';git push origin HEAD:feature/daily-music-catalog
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: music-complete-scan, path: music-discovery.json, retention-days: 5}
