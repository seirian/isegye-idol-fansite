name: Verify owner-requested performance videos
on:
  push:
    branches: [content/studio-choom-rebels]
    paths: [.github/workflows/studio-choom-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify teaser and owner-supplied replacement upload
        env:
          YOUTUBE_API_KEY: ${{ secrets.ISEGYE_YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,datetime,pathlib
          ids=['_E9ZHH9R7o4','Mj7q8HU8ZXg']
          key=os.environ.get('YOUTUBE_API_KEY','').strip()
          if not key: raise SystemExit('Existing YouTube key is not configured')
          url='https://www.googleapis.com/youtube/v3/videos?'+urllib.parse.urlencode({'part':'snippet,contentDetails,status','id':','.join(ids),'key':key})
          try:
              with urllib.request.urlopen(url,timeout=30) as r: data=json.load(r)
          except Exception as e:
              raise SystemExit('Public video metadata request failed: '+type(e).__name__) from None
          found={x['id']:x for x in data.get('items',[])}
          if set(found)!=set(ids): raise SystemExit('One or both requested videos are not available')
          now=datetime.datetime.now(datetime.timezone.utc)
          result={'checkedAt':now.isoformat(),'source':'YouTube Data API v3 videos.list','scope':'public metadata and availability; not a full playback review','replacesVideoId':'z8AJgnTC52k','videos':[]}
          for vid in ids:
              x=found[vid]; s=x['snippet']; status=x['status']
              if status.get('privacyStatus')!='public': raise SystemExit('Requested video is not public')
              if s['channelId']!='UCEIi7zFR_wE23jFncVtd6-A': raise SystemExit('Unexpected uploader')
              if datetime.datetime.fromisoformat(s['publishedAt'].replace('Z','+00:00'))>now: raise SystemExit('Requested video is not published yet')
              result['videos'].append({'videoId':vid,'title':s['title'],'channelId':s['channelId'],'channelTitle':s['channelTitle'],'publishedAt':s['publishedAt'],'duration':x['contentDetails']['duration'],'privacyStatus':status.get('privacyStatus'),'embeddable':status.get('embeddable'),'liveBroadcastContent':s.get('liveBroadcastContent'),'url':'https://www.youtube.com/watch?v='+vid,'description':s.get('description','')})
          pathlib.Path('requested-videos.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Archive exact working source without credentials
        run: git archive HEAD -o requested-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: requested-performance-verification
          path: |
            requested-videos.json
            requested-source.tar
          retention-days: 14
