name: Schedule - hourly permitted-source refresh
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Production - isolated inour SFTP deployment']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: isegye-inour-production
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment: production
    # Playwright 1.56 Chromium does not support the ubuntu-26.04 latest runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Respect collection pause controls before any public read
        env:
          PRODUCTION_PAUSED: ${{ vars.PRODUCTION_PAUSED }}
          ISEGYE_SCHEDULE_PAUSED: ${{ vars.ISEGYE_SCHEDULE_PAUSED }}
        run: test "$PRODUCTION_PAUSED" != true && test "$ISEGYE_SCHEDULE_PAUSED" != true
      - name: Check data rules and data-only publication boundary
        run: python -m unittest discover -s tests -p 'test_schedule*.py' -v
      - name: Discover new member, agency and roundup signals using the official Search API only
        if: vars.PRODUCTION_PAUSED != 'true' && vars.ISEGYE_SCHEDULE_PAUSED != 'true'
        run: python scripts/cafe_batch_discovery.py
        env:
          ISEGYE_NAVER_CLIENT_ID: ${{ secrets.ISEGYE_NAVER_CLIENT_ID }}
          ISEGYE_NAVER_CLIENT_SECRET: ${{ secrets.ISEGYE_NAVER_CLIENT_SECRET }}
      - name: Install pinned SFTP and public-page reader
        run: |
          python -m venv /tmp/schedule-refresh
          /tmp/schedule-refresh/bin/pip install paramiko==5.0.0 playwright==1.56.0
          bash scripts/ci_browser_install.sh /tmp/schedule-refresh/bin/python
      - name: Verify approved Cafe public windows without production credentials
        run: /tmp/schedule-refresh/bin/python scripts/refresh_reviewed_cafe.py
      - name: Collect permitted sources and atomically publish private snapshot
        run: /tmp/schedule-refresh/bin/python scripts/publish_schedule_feed.py
        env:
          PRODUCTION_PAUSED: ${{ vars.PRODUCTION_PAUSED }}
          ISEGYE_SCHEDULE_PAUSED: ${{ vars.ISEGYE_SCHEDULE_PAUSED }}
          ISEGYE_CAFE_REVIEW_PATH: cafe-window.json
          ISEGYE_SFTP_PASSWORD: ${{ secrets.ISEGYE_SFTP_PASSWORD }}
          ISEGYE_NAVER_CLIENT_ID: ${{ secrets.ISEGYE_NAVER_CLIENT_ID }}
          ISEGYE_NAVER_CLIENT_SECRET: ${{ secrets.ISEGYE_NAVER_CLIENT_SECRET }}
      - name: Fail on incomplete collection even when snapshot publication succeeded
        if: always()
        run: python scripts/schedule_health.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: schedule-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            schedule-publication.json
            schedule-health.json
            cafe-discovery.json
            cafe-window.json
          retention-days: 14
