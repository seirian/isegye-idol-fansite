name: Verify music listing shape
on:
  push:
    branches: [feature/daily-music-catalog]
    paths: [.github/workflows/music-shape-verification.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          PYTHONPATH=scripts python - <<'PY'
          import daily_music as m,daily_music_listing as l,json
          k='c2';cid=m.CHANNELS[k][0];d={}
          s=m.read('https://www.youtube.com/channel/'+cid+'/videos?hl=en',4500000).decode();j=l.embedded(s,'ytInitialData');d['keys']=list(j);d['metadata']=j.get('metadata',{}).get('channelMetadataRenderer',{}).get('externalId');d['tabs']=[(t['tabRenderer'].get('selected'),t['tabRenderer'].get('title'),t['tabRenderer'].get('endpoint',{}).get('commandMetadata')) for t in l.tree(j.get('contents',{})) if 'tabRenderer' in t];n=[n for n in l.tree(j.get('contents',{})) if any(x in n for x in ['videoRenderer','lockupViewModel'])];d['sample']=str(n[0])[:6000] if n else 'empty';d['roles']=m.selections()[0]['channels'][k]['role'];print(json.dumps(d,ensure_ascii=False));
          try: print(l.public_rows(cid,k,m.datetime.now(m.timezone.utc),{'review':[],'verificationErrors':0},set())[0:2])
          except Exception as e: print(type(e).__name__,str(e))
          PY