name: Cafe - bounded November recovery inspection
on:
  push:
    branches: ['fix/cafe-schedule-refresh']
    paths: ['.github/workflows/cafe-recovery.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Save exact tracked source for isolated regression tests
        run: git archive --format=zip HEAD -o source.zip
      - name: Read only existing approved public boards and fan series
        run: |
          python -m venv /tmp/cafe-review
          /tmp/cafe-review/bin/pip -q install playwright==1.56.0
          bash scripts/ci_browser_install.sh /tmp/cafe-review/bin/python > /tmp/cafe-browser.log
          /tmp/cafe-review/bin/python scripts/review_cafe_window.py 2026-11-03
          /tmp/cafe-review/bin/python scripts/review_fan_series.py 2026-11-03
          /tmp/cafe-review/bin/python scripts/review_fan_cards.py fan-review.json
          /tmp/cafe-review/bin/python scripts/pack_cafe_window.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cafe-recovery-source-and-metadata
          path: |
            source.zip
            cafe-review.json
            fan-review.json
            fan-cards.json
            cafe-window.json
          if-no-files-found: error
          retention-days: 14
