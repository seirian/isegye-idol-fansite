name: Approved notices - public history boundary check
on:
  push:
    branches: ['feature/approved-notice-history']
    paths: ['.github/workflows/notice-history-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          git archive --format=zip --output=source.zip HEAD
          python -m venv /tmp/notices
          /tmp/notices/bin/pip install playwright==1.56.0
          bash scripts/ci_browser_install.sh /tmp/notices/bin/python
          /tmp/notices/bin/python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from datetime import datetime, timezone
          from playwright.sync_api import sync_playwright
          report={'checkedAt':datetime.now(timezone.utc).isoformat(),'authenticated':False,'pages':[],'responses':[]}
          with sync_playwright() as p:
              b=p.chromium.launch();c=b.new_context(locale='ko-KR');page=c.new_page()
              active={'page':None}
              def response(r):
                  if 'apis.naver.com/cafe-web/cafe-boardlist-api/' not in r.url: return
                  try:
                      v=r.json();result=v.get('result',{});rows=[]
                      for entry in result.get('articleList',[]):
                          x=entry.get('item',{});w=x.get('writerInfo',{})
                          if not x.get('articleId'):continue
                          row={k:x.get(k) for k in ('articleId','cafeId','menuId','subject','writeDateTimestamp','openArticle','restrictMenu','readLevel')}
                          row['writer']={k:w.get(k) for k in ('nickName','staff','manager','memberLevelName')}
                          rows.append(row)
                      report['responses'].append({'page':active['page'],'status':r.status,'url':r.url,'keys':list(result),'counts':{k:x for k,x in result.items() if isinstance(x,(int,bool))},'rows':rows})
                  except Exception as e:report['responses'].append({'page':active['page'],'error':type(e).__name__})
              page.on('response',response)
              for name,u in [('first','https://cafe.naver.com/f-e/cafes/27842958/menus/345?page=1'),('oldest','https://cafe.naver.com/f-e/cafes/27842958/menus/345?page=480'),('agency','https://cafe.naver.com/f-e/cafes/27842958/menus/1250'),('excluded1','https://cafe.naver.com/steamindiegame/22133027'),('excluded2','https://cafe.naver.com/steamindiegame/22133865')]:
                  active['page']=name
                  try:
                      r=page.goto(u,wait_until='domcontentloaded',timeout=30000);page.wait_for_timeout(2000)
                      text=page.locator('body').inner_text()
                      report['pages'].append({'name':name,'status':r.status,'url':page.url,'visibleText':text[:14000] if name in ('first','oldest','agency') else text[:1500]})
                      if name=='oldest':page.screenshot(path='oldest-board.png',full_page=True)
                  except Exception as e:report['pages'].append({'name':name,'error':type(e).__name__})
              b.close()
          Path('boundary.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: notice-boundary-${{ github.run_id }}
          path: |
            source.zip
            boundary.json
            oldest-board.png
          retention-days: 3
