name: Cafe - integrate isolated repair sources
on:
  push:
    branches: ['fix/cafe-schedule-refresh']
    paths: ['.github/workflows/cafe-apply-source.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Apply exact source anchors, never production state
        run: |
          test "$GITHUB_REF" = refs/heads/fix/cafe-schedule-refresh
          python review/apply-cafe-repair.py
      - name: Validate all source and unit regressions
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit tested sources to the isolated repair branch only
        run: |
          test "$GITHUB_REF" = refs/heads/fix/cafe-schedule-refresh
          python - <<'PY'
          import subprocess
          allowed={'scripts/notice_policy.py','scripts/schedule_feed.py','scripts/publish_schedule_feed.py','scripts/cafe_batch_discovery.py','scripts/review_cafe_window.py','scripts/compose_schedule.py','schedule/core.js','schedule/ui.js','scripts/verify_release_v04.py','review/home-release.json'}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual <= allowed, actual-allowed
          subprocess.run(['git','add','--',*sorted(actual)],check=True)
          PY
          git rm -- review/apply-cafe-repair.py review/cafe-repair-part-0.b64
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: integrate verified cafe runtime and source freshness checks'
          git push origin HEAD:refs/heads/fix/cafe-schedule-refresh
          git archive --format=zip HEAD -o integrated-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cafe-integrated-source
          path: integrated-source.zip
          if-no-files-found: error
          retention-days: 14
