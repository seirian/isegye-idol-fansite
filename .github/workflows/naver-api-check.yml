name: Naver Search API - sanitized connection check
on:
  push:
    branches: ['feature/naver-key-check']
    paths: ['.github/workflows/naver-api-check.yml']
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/feature/naver-key-check'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check official API only; never print credentials or raw responses
        env:
          ISEGYE_NAVER_CLIENT_ID: ${{ secrets.ISEGYE_NAVER_CLIENT_ID }}
          ISEGYE_NAVER_CLIENT_SECRET: ${{ secrets.ISEGYE_NAVER_CLIENT_SECRET }}
          CLIENT_ID_VARIABLE_PRESENT: ${{ vars.ISEGYE_NAVER_CLIENT_ID != '' }}
          CLIENT_SECRET_VARIABLE_PRESENT: ${{ vars.ISEGYE_NAVER_CLIENT_SECRET != '' }}
        run: |
          python - <<'PY'
          import json, os, re, time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          client = os.environ.pop('ISEGYE_NAVER_CLIENT_ID', '').strip()
          secret = os.environ.pop('ISEGYE_NAVER_CLIENT_SECRET', '').strip()
          report = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'environment': 'production',
              'clientIdSecretPresent': bool(client),
              'clientSecretSecretPresent': bool(secret),
              'clientIdVariablePresent': os.environ.get('CLIENT_ID_VARIABLE_PRESENT') == 'true',
              'clientSecretVariablePresent': os.environ.get('CLIENT_SECRET_VARIABLE_PRESENT') == 'true',
              'credentialValuesRecorded': False,
              'rawResponsesRecorded': False,
              'siteOrAccountFilesReadOrWritten': False,
              'checks': [],
          }
          safe = bool(client and secret) and all(33 <= ord(c) <= 126 for c in client + secret)
          report['headerValuesUsable'] = safe
          queries = ['이세계아이돌 왁물원 공지', '이세돌 뱅온정보'] + [n + ' 왁물원 방송' for n in ('아이네','징버거','릴파','주르르','고세구','비챤')]
          if safe:
              headers = {'X-Naver-Client-Id': client, 'X-Naver-Client-Secret': secret, 'User-Agent':'IsegyeSchedule/1.0 (+https://isegye-idol.kr/auth/terms)', 'Accept':'application/json'}
              for index, query in enumerate(queries):
                  result = {'queryIndex': index + 1}
                  url = 'https://openapi.naver.com/v1/search/cafearticle.json?' + urlencode({'query':query,'display':20,'sort':'date'})
                  try:
                      request = Request(url, headers=headers)
                      with build_opener(NoRedirect).open(request, timeout=20) as response:
                          result['httpStatus'] = response.status
                          raw = response.read(2097153)
                      if len(raw) > 2097152: raise ValueError('response limit')
                      data = json.loads(raw)
                      result['validItemsArray'] = isinstance(data.get('items'), list)
                      if result['validItemsArray']: result['returnedItemCount'] = len(data['items'])
                  except HTTPError as error:
                      result['httpStatus'] = error.code
                      try:
                          data = json.loads(error.read(16384))
                          code = str(data.get('errorCode', ''))
                          if re.fullmatch(r'(?:[0-9]{3}|SE[0-9]{2})', code): result['errorCode'] = code
                          message = str(data.get('errorMessage', '')).lower()
                          if 'api 권한' in message or 'permission' in message: result['errorCategory'] = 'api_permission'
                          elif 'authentication' in message or '인증' in message: result['errorCategory'] = 'authentication'
                          elif 'quota' in message or '한도' in message: result['errorCategory'] = 'quota'
                          else: result['errorCategory'] = 'upstream_http_error'
                      except Exception: result['errorCategory'] = 'unparsed_http_error'
                  except Exception as error:
                      result['exceptionType'] = type(error).__name__
                  report['checks'].append(result)
                  if result.get('httpStatus') != 200 or not result.get('validItemsArray'): break
                  time.sleep(0.3)
          report['allSearchQueriesSucceeded'] = len(report['checks']) == len(queries) and all(r.get('httpStatus') == 200 and r.get('validItemsArray') for r in report['checks'])
          client = secret = None
          Path('naver-api-check.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: naver-api-check-${{ github.run_id }}
          path: naver-api-check.json
          retention-days: 3
