name: UI cleanup - apply verified patch
on:
  push:
    branches: [feature/remove-redundant-ui]
    paths: [.github/workflows/ui-cleanup-integrate.yml]
permissions: {contents: read}
jobs:
  integrate:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/feature/remove-redundant-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply exactly the reviewed six-file patch and run existing regression tests
        run: |
          git apply --check review/ui-cleanup.patch
          git apply review/ui-cleanup.patch
          git diff --check
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit implementation only; remove one-time inspection and integration files
        run: |
          git fetch origin feature/remove-redundant-ui
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm .github/workflows/ui-cleanup-source.yml .github/workflows/ui-cleanup-integrate.yml review/ui-cleanup.patch
          git add review/home-release.json scripts/build_home_review.py scripts/compose_ui_cleanup.py scripts/verify_release_v04.py tests/test_ui_cleanup.py tests/ui_cleanup_browser.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(ui): remove redundant header and home LIVE controls; preserve automatic updates'
          git push origin HEAD:feature/remove-redundant-ui
