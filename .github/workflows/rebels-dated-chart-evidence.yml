name: REBELS dated complete-chart verification
on:
  push:
    branches: ['fix/rebels-melon-backfill-20261116']
    paths: ['.github/workflows/rebels-dated-chart-evidence.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify source dates before accepting chart-out evidence
        run: |
          mkdir -p evidence
          python -u - <<'PY'
          from urllib.request import urlopen,Request
          from pathlib import Path
          import json,time,hashlib,re
          times=[f'202611{d:02d}-{h:02d}' for d in range(10,17) for h in range(1,7) if (d,h)!=(11,1)]
          times+=['20261109-18','20261110-16','20261112-07','20261112-09','20261113-07']
          requests=[('top100',t) for t in times]+[('hot100-d100','20261109-18')]
          result=[]
          for kind,t in requests:
              date,hour=t.split('-');url=f'https://xn--o39an51b2re.com/chart/melon/{kind}/{date}/{int(hour)}'
              try:
                  with urlopen(Request(url,headers={'User-Agent':'Isegye-Rebels-OneTime-Review/1.0'}),timeout=15) as r:raw=r.read(1500001);final=r.url
                  if len(raw)>1500000:raise ValueError('Oversize page')
                  match=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',raw.decode(),re.S)
                  page=json.loads(match[1]);data=page['props']['pageProps']['data']
                  expected=f'{date[:4]}-{date[4:6]}-{date[6:8]}T{hour}:00:00'
                  if data['time']!=expected:raise ValueError('Source clock mismatch: '+data['time'])
                  ranks=data['data']
                  if len(ranks)!=100 or sorted(x['ranking'] for x in ranks)!=list(range(1,101)):raise ValueError('Incomplete chart')
                  if len({x['song']['id'] for x in ranks})!=100:raise ValueError('Duplicate song identities')
                  present=[x['ranking'] for x in ranks if x['song']['id']=='603813508']
                  name=f'{kind}-{t}.html';Path('evidence',name).write_bytes(raw)
                  result.append({'url':url,'finalUrl':final,'file':name,'at':expected,'chart':data['chart'],'rebelsRanks':present,'verifiedFullChartSize':100,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
              except Exception as e:result.append({'url':url,'error':type(e).__name__,'detail':str(e)[:160]})
              Path('evidence/index.json').write_text(json.dumps(result,indent=2))
              print(json.dumps(result[-1]),flush=True)
              if len(result)==1 and 'error' in result[-1]:raise RuntimeError('First dated chart failed; remaining requests cancelled')
              time.sleep(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rebels-dated-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 7
