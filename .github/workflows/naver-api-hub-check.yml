name: NAVER API HUB - isolated connection check
on:
  push:
    branches: ['feature/naver-api-hub']
    paths: ['.github/workflows/naver-api-hub-check.yml']
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/feature/naver-api-hub'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: |
          mkdir -p hub-check
          git archive --format=zip --output=hub-check/source.zip HEAD
      - name: Check official API Hub without logging keys or raw responses
        env:
          ISEGYE_NAVER_CLIENT_ID: ${{ secrets.ISEGYE_NAVER_CLIENT_ID }}
          ISEGYE_NAVER_CLIENT_SECRET: ${{ secrets.ISEGYE_NAVER_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json, os, re, sys, time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          sys.path.insert(0, 'scripts')
          import schedule_feed as feed
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          endpoint = 'https://naverapihub.apigw.ntruss.com/search/v1/cafearticle'
          client = os.environ.pop('ISEGYE_NAVER_CLIENT_ID', '').strip()
          secret = os.environ.pop('ISEGYE_NAVER_CLIENT_SECRET', '').strip()
          report = {'checkedAt':datetime.now(timezone.utc).isoformat(), 'provider':'NAVER API HUB', 'endpoint':endpoint, 'clientIdPresent':bool(client), 'clientSecretPresent':bool(secret), 'credentialValuesRecorded':False, 'rawResponsesRecorded':False, 'siteOrAccountFilesReadOrWritten':False, 'checks':[]}
          queries = ['이세계아이돌 왁물원 공지','이세돌 뱅온정보'] + [n+' 왁물원 방송' for n in feed.MEMBERS.values()]
          found = set()
          if client and secret and all(33 <= ord(c) <= 126 for c in client+secret):
              headers = {'X-NCP-APIGW-API-KEY-ID':client, 'X-NCP-APIGW-API-KEY':secret, 'Accept':'application/json', 'User-Agent':feed.AGENT}
              for index, query in enumerate(queries):
                  result = {'queryIndex':index+1}
                  url = endpoint+'?'+urlencode({'query':query,'display':20,'start':1,'sort':'date','format':'json'})
                  try:
                      with build_opener(NoRedirect).open(Request(url,headers=headers),timeout=20) as response:
                          result['httpStatus']=response.status
                          raw=response.read(2097153)
                      if len(raw)>2097152:raise ValueError('response_limit')
                      data=json.loads(raw)
                      result['validItemsArray']=isinstance(data,dict) and isinstance(data.get('items'),list)
                      if result['validItemsArray']:
                          result['returnedItems']=len(data['items'])
                          accepted=set()
                          for item in data['items']:
                              link=feed.source_url(item.get('link',''))
                              if link and link.startswith('https://cafe.naver.com/steamindiegame/') and feed.members_in(feed.text(item.get('title',''))):accepted.add(link)
                          result['eligibleWakmulwonItems']=len(accepted)
                          found.update(accepted)
                  except HTTPError as error:
                      result['httpStatus']=error.code
                      try:
                          payload=json.loads(error.read(16384))
                          detail=payload.get('error',payload)
                          code=str(detail.get('errorCode',''))
                          if re.fullmatch(r'(?:[0-9]{3}|SE[0-9]{2})',code):result['errorCode']=code
                      except Exception:pass
                  except Exception as error:result['exceptionType']=type(error).__name__
                  report['checks'].append(result)
                  if result.get('httpStatus')!=200 or not result.get('validItemsArray'):break
                  time.sleep(.3)
          report['allQueriesSucceeded']=len(report['checks'])==len(queries) and all(x.get('httpStatus')==200 and x.get('validItemsArray') for x in report['checks'])
          report['uniqueEligibleWakmulwonItems']=len(found)
          client=secret=None
          Path('hub-check/connection.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          raise SystemExit(0 if report['allQueriesSucceeded'] else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: naver-api-hub-check-${{ github.run_id }}
          path: hub-check/
          retention-days: 3
