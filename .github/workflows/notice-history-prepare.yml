name: Approved notices - validate and prepare source
on:
  push:
    branches: ['feature/approved-notice-history']
    paths: ['.github/workflows/notice-history-prepare.yml']
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    if: github.repository == 'seirian/isegye-idol-fansite' && github.ref == 'refs/heads/feature/approved-notice-history'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/approved-notice-history
      - name: Verify exact reviewed patch bytes before applying
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,base64,zlib,subprocess
          parts=[Path('.work/notice-change.'+tag).read_text().strip() for tag in ('0','1a','1b','2a','2b','3a','3b')]
          raw=zlib.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='ff58e5f0b0007785e0015a04af12eb9d965e6a5d679ae7a214d49781f2d5f086','Patch bytes differ'
          Path('/tmp/notice.diff').write_bytes(raw)
          subprocess.run(['git','apply','--check','/tmp/notice.diff'],check=True)
          subprocess.run(['git','apply','/tmp/notice.diff'],check=True)
          PY
      - name: Import the completed, checksum-verified listing archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/seirian/isegye-idol-fansite/actions/artifacts/12956254268/zip > /tmp/approved-history.zip
          python scripts/import_notice_history.py /tmp/approved-history.zip f0e0022c39fe3361952231688623858a3535ccd4deea2372e1260891dbcc4ae9
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('schedule/approved-notices.json').read_text())
          coverage=json.loads(Path('schedule/notice-history-coverage.json').read_text())
          assert coverage['complete'] is True and len(data['notices'])==7249
          assert [(x['menu'],x['pagesRead']) for x in coverage['boards']]==[(345,480),(1250,5)]
          Path('notice-import-report.json').write_text(json.dumps({'sourceRun':41009729297,'artifactId':12956254268,'artifactSha256':'f0e0022c39fe3361952231688623858a3535ccd4deea2372e1260891dbcc4ae9','acceptedCount':7249,'completePublicListings':True,'articleBodiesReviewed':False}))
          PY
      - name: Run regressions and remove one-time helper workflows
        run: |
          npm test > /tmp/notice-node-tests.txt 2>&1
          python -m unittest discover -s tests -p 'test_*.py' -v > /tmp/notice-python-tests.txt 2>&1
          rm -f .work/notice-change.*
          rm -f .github/workflows/notice-history-inspect.yml .github/workflows/notice-history-backfill.yml .github/workflows/notice-history-resume.yml .github/workflows/notice-history-prepare.yml
          git add scripts/notice_policy.py scripts/compose_schedule.py scripts/schedule_feed.py scripts/publish_schedule_feed.py scripts/import_notice_history.py schedule/core.js schedule/ui.js schedule/theme.css schedule/approved-notices.json schedule/notice-history-coverage.json review/home-release.json tests/test_schedule_feed.py tests/test_schedule_api_hub.py tests/test_notice_policy.py tests/schedule.test.js tests/schedule_browser.py docs/SCHEDULE-INGESTION.md .work .github/workflows/notice-history-inspect.yml .github/workflows/notice-history-backfill.yml .github/workflows/notice-history-resume.yml .github/workflows/notice-history-prepare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(schedule): publish approved authors only and archive 7249 public notices'
          git push origin HEAD:feature/approved-notice-history
          git archive --format=zip --output=notice-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: notice-source-${{ github.run_id }}
          path: |
            notice-source.zip
            notice-import-report.json
            /tmp/notice-node-tests.txt
            /tmp/notice-python-tests.txt
          retention-days: 7
