<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="이파리가 주인공인 작은 이야기 RPG. 여섯 멤버와 함께 기록의 세계를 지나 마지막 앙코르에 도전하세요.">
<!--CSP-->
<title>이파리 연대기 · 마지막 앙코르</title>
<!--STYLE-->
</head>
<body>
<a class="skip-link" href="#game-main">게임으로 바로가기</a>
<div class="rpg-shell">
<header class="topbar">
<button class="brand" id="home-button" aria-label="이파리 연대기 시작 화면"><span class="brand-mark" aria-hidden="true">❧</span><span>이파리 연대기<small>THE LAST ENCORE</small></span></button>
<nav aria-label="게임 메뉴"><button id="journal-button" class="nav-button">기록첩 <span aria-hidden="true">↗</span></button><button id="settings-button" class="nav-button">설정</button><button id="pause-button" class="icon-button" aria-label="일시 정지">Ⅱ</button></nav>
</header>
<main id="game-main" tabindex="-1"></main>
<footer class="site-note"><span>이세계아이돌 활동 기록에서 시작된, 이파리의 창작 모험</span><span>비공식 팬게임 · 이 브라우저에 자동 저장</span></footer>
</div>
<div id="save-notice" class="save-notice" role="status" aria-live="polite"></div>
<div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<dialog id="rpg-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
<!--SCRIPT-->
</body>
</html>
